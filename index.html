{
  id:"l8", title:"Making Decisions Under Uncertainty", desc:"Deciding well when you don't, and won't, have all the information.",
  reading:[
    "Leaders rarely get to decide with complete information. Waiting for certainty is itself a decision, usually the decision to let the moment pass. The skill is not eliminating uncertainty, it is deciding well despite it.",
    "One useful distinction is between reversible and irreversible decisions. A reversible choice deserves speed over analysis, since you learn more by trying it than by debating it further. An irreversible one deserves more deliberation, because you cannot easily walk it back.",
    "## Why Waiting Feels Safer Than It Is",
    "Gathering more information before deciding feels responsible, and often is, up to a point. But information gathering has diminishing returns, and past that point, continuing to wait is not really about the information anymore, it is about avoiding the discomfort of committing to a choice that might turn out wrong. Meanwhile, the cost of not deciding, a stalled project, a missed window, a team left without direction, keeps accumulating quietly in the background, often unnoticed because it does not announce itself the way a bad decision does.",
    "## A Simple Framework for Speed",
    "Sorting a decision into reversible or irreversible before doing anything else clarifies almost everything that follows. Reversible decisions, ones you can undo or adjust cheaply if they don't work, should generally be made quickly, because trying something and observing the result usually teaches you more, faster, than continuing to debate it in the abstract. Irreversible decisions, ones that are expensive or impossible to walk back, genuinely deserve more time, more input, and more stress-testing before committing, precisely because there is no cheap way to correct course afterward.",
    "Many decisions that feel irreversible in the moment turn out, on closer inspection, to be more reversible than they seemed, which is worth checking explicitly before assuming a decision needs the slow, careful treatment.",
    "## Owning the Outcome",
    "No decision-making process eliminates the possibility of being wrong, and every leader accumulates a track record that includes some mistakes. What actually separates leaders that people keep following after a bad call from leaders that people quietly stop trusting is not whether they ever make mistakes, it is how they own the outcome afterward: naming plainly what happened, extracting the real lesson, and visibly adjusting the next decision, rather than deflecting blame or pretending it did not happen.",
    "## Deciding Without Certainty, Repeatedly",
    "Because most real decisions happen without complete information, this is not a one-time skill to master and move past, it is a repeated practice: sort the decision by reversibility, decide at the appropriate speed, and when the outcome is known, whatever it turns out to be, own it openly and use it to make the next decision better."
  ],
  examples:[
    {title:"Example: A reversible decision, made fast", text:"A team debates for a week whether to switch their weekly meeting from Monday to Tuesday. It is a fully reversible choice. The lead finally says, 'Let's just try Tuesday for three weeks and revisit,' ending the debate and letting the team learn from experience rather than speculation."},
    {title:"Example: An irreversible decision, made carefully", text:"A company is deciding whether to publicly commit to a launch date for a major product. Once announced, backing out would damage trust with customers. The leader takes an extra week to stress-test the plan with the engineering team before making the public commitment, since this decision is much harder to reverse."}
  ],
  takeaways:["Waiting for certainty is itself a decision, usually to let the moment pass.","Reversible decisions deserve speed; you learn more by trying than by debating further.","Irreversible decisions deserve more deliberation, since they're hard to walk back.","What happens right after a bad decision often matters more than the decision itself."],
  quiz:[
    {q:"What does the lesson say about waiting for complete certainty before deciding?", options:["It's always the safest option","It's itself a decision, usually to let the moment pass","It guarantees a better outcome","It has no real cost"], correct:1},
    {q:"Which decisions does the lesson say deserve more deliberation?", options:["All decisions equally","Only decisions involving money","Reversible ones, since mistakes are cheap","Irreversible ones, since they can't easily be walked back"], correct:3},
    {q:"In the first example, why did the lead choose to act quickly on the meeting-day debate?", options:["The decision was irreversible and needed careful analysis","The decision was reversible, so trying it was more useful than more debate","The team demanded an immediate answer","It was the least important decision the team faced"], correct:1},
    {q:"What did the lead say to move the team forward in that example?", options:["'Let's debate this for another month'","'Let's just try Tuesday for three weeks and revisit'","'We'll never change the meeting day'","'I'll decide alone without your input'"], correct:1},
    {q:"In the second example, why did the leader take an extra week before committing to a launch date?", options:["The decision was reversible and low-stakes","Announcing publicly would be hard to walk back, so it deserved more deliberation","She was avoiding the decision entirely","The team asked for a delay unrelated to the decision"], correct:1},
    {q:"What does the lesson say actually separates leaders people keep following after a mistake from those they don't?", options:["Whether they ever make mistakes at all","How they own the outcome and adjust afterward","How quickly they assign blame","Whether the decision was reversible"], correct:1},
    {q:"According to the lesson, what should you do when a decision goes badly?", options:["Avoid discussing it to protect morale","Own the outcome plainly, extract the lesson, and adjust the next decision","Reverse all future decision-making authority","Wait for someone else to address it"], correct:1},
    {q:"Why does a reversible decision deserve speed over prolonged analysis, per the lesson?", options:["Speed is always better regardless of stakes","You learn more by trying it than by debating it further","Reversible decisions don't matter","Analysis is never useful"], correct:1},
    {q:"What is the main risk of over-analyzing a highly reversible decision?", options:["None, thorough analysis is always beneficial","Letting the moment pass and losing the chance to learn by doing","It guarantees a worse outcome","It has no connection to leadership"], correct:1},
    {q:"Which best summarizes this lesson's core idea?", options:["Leaders should always decide instantly regardless of stakes","Match your decision speed to reversibility, and own the outcome honestly afterward","Uncertainty should always be eliminated before deciding","Irreversible decisions should be made as quickly as possible"], correct:1}
  ]
},
{
  id:"l9", title:"Leading Through Change and Conflict", desc:"Staying steady and useful when things are tense or unsettled.",
  reading:[
    "Change unsettles people, even good change, because it removes the predictability they were relying on. A leader's job during change is not to pretend everything is fine, but to be honest about what's known, what isn't, and what will stay the same.",
    "Conflict, similarly, is not a sign that leadership has failed. Two people with different priorities disagreeing is normal. What matters is whether the leader can surface the actual disagreement, rather than letting it fester as vague tension, and help the group find a workable path forward.",
    "## What People Actually Need During Change",
    "In the absence of real information, people do not simply wait patiently, they fill the gap with speculation, and speculation during uncertain times tends to skew toward the worst plausible outcome. This is a natural, protective instinct, not a character flaw, but it means that silence from a leader during a period of change is rarely experienced as neutral; it is experienced as a void that anxiety rushes in to fill. Sharing what is known, clearly naming what is not yet known, and being explicit about what will remain the same, even when the full picture is still incomplete, gives people something concrete to hold onto and plan around.",
    "## Conflict Is Not Failure",
    "It is tempting to treat any visible disagreement on a team as evidence that something has gone wrong. In reality, a team with zero visible disagreement is often not a harmonious team, it is a team where people have learned that raising disagreement is not worth the cost, and are quietly withholding real concerns instead. Healthy conflict, disagreement about priorities, approaches, or trade-offs, expressed directly and worked through openly, is usually a sign of a team that trusts each other enough to be honest, not a sign of dysfunction.",
    "## Naming the Disagreement",
    "The dangerous version of conflict is not open disagreement, it is the version that goes underground: sarcasm in meetings, quietly working around someone instead of with them, growing tension that never gets named directly. This kind of conflict rarely resolves on its own; it tends to compound. A leader who notices this pattern and names it plainly, bringing the people involved together and simply stating what has been observed, usually resolves the actual disagreement far faster than the vague tension would have on its own, because most indirect conflict is standing in for a specific, nameable disagreement that has simply never been said out loud.",
    "## Staying Steady Yourself",
    "Leading through change and conflict also requires managing your own reaction to both, since a visibly anxious or defensive leader tends to amplify exactly the uncertainty and tension they are trying to help the team through. This connects directly back to the self-awareness and emotional intelligence covered earlier in this course: a leader's own steadiness, or lack of it, is one of the most contagious things in the room during a difficult period."
  ],
  examples:[
    {title:"Example: Honesty during a reorganization", text:"A department is restructured, and roles will change. Instead of saying 'nothing will really change,' the leader says, 'Reporting lines will shift, and two roles will be combined. I don't yet know who takes the combined role, but I'll tell you by Friday, and your core work won't change in the meantime.' This is unsettling news, but it is honest, and people can plan around it."},
    {title:"Example: Naming a conflict directly", text:"Two team members keep disagreeing indirectly in meetings, through sarcasm and pointed comments. Rather than letting it continue, their manager pulls them aside together and says plainly, 'It seems like you two see this differently. Let's talk through it directly so we can move forward.' The underlying disagreement, about ownership of a feature, gets resolved in twenty minutes."}
  ],
  takeaways:["Change unsettles people by removing predictability, even when the change is good.","A leader's job during change is honesty about what's known, unknown, and unchanged.","Conflict is normal, not a leadership failure.","Naming a disagreement directly usually resolves it faster than letting it fester as vague tension."],
  quiz:[
    {q:"Why does change unsettle people, according to the lesson, even when it's positive?", options:["Change is always objectively bad","It removes predictability people were relying on","People dislike their leaders during change","Change always means job loss"], correct:1},
    {q:"What is a leader's job during change, per the lesson?", options:["To pretend everything is fine","To be honest about what's known, unknown, and what will stay the same","To avoid discussing the change at all","To promise nothing will change"], correct:1},
    {q:"In the reorganization example, what made the leader's message effective despite being unsettling?", options:["It avoided mentioning any changes","It was honest about what was known, unknown, and unchanged, with a timeline","It promised no roles would be affected","It was vague to avoid causing anxiety"], correct:1},
    {q:"What does the lesson say conflict is a sign of?", options:["Leadership failure","People with different priorities disagreeing, which is normal","A team that should be broken up","Poor hiring decisions"], correct:1},
    {q:"In the second example, what did the manager do about the indirect conflict?", options:["Ignored it, hoping it would resolve itself","Named it directly and brought both people together to talk it through","Reassigned one team member immediately","Sent a company-wide memo about professionalism"], correct:1},
    {q:"What was the actual underlying issue in the second example?", options:["A personality clash with no real cause","Disagreement about ownership of a feature","A pay dispute","Different work schedules"], correct:1},
    {q:"How long did it take to resolve the conflict once it was named directly?", options:["Several months","About twenty minutes","It was never resolved","A full week of meetings"], correct:1},
    {q:"What risk does the lesson associate with letting conflict 'fester as vague tension'?", options:["It resolves itself faster","It tends to persist and show up indirectly, like through sarcasm, instead of getting addressed","It has no downside","It always leads to positive outcomes"], correct:1},
    {q:"Why might naming a disagreement directly work better than letting it continue indirectly?", options:["It surfaces the actual issue so it can be worked through, instead of guessed at","Direct conversations are always uncomfortable and unproductive","It assigns blame more clearly","It avoids the need for any resolution"], correct:0},
    {q:"Which best summarizes this lesson's core idea?", options:["Leaders should avoid change and conflict whenever possible","Leading well through change and conflict means staying honest and surfacing issues directly, not avoiding them","Conflict always indicates a leader has failed","Change should always be minimized to protect morale"], correct:1}
  ]
},
{
  id:"l10", title:"Vision, Values, and Sustaining Leadership Over Time", desc:"Leading in a way that holds up over months and years, not just in a single moment.",
  reading:[
    "A single good decision does not make someone a leader; a pattern does. Vision is the ability to describe, in concrete terms, where the group is headed and why it matters, so people can make good choices even when the leader is not in the room.",
    "Values are what you protect even when it costs you something. A stated value that is abandoned under pressure teaches people that it was never really a value at all, just a slogan. Sustaining leadership over time also means managing your own energy, since a depleted leader eventually leads worse, regardless of skill.",
    "## What Concrete Vision Looks Like",
    "Vague vision statements, being the best, delighting customers, changing the world, sound inspiring but give a team almost nothing to actually navigate by, because they cannot be used to choose between two reasonable-sounding options in the moment. Concrete vision names a specific, observable outcome and the reason it matters, specific enough that someone who has never spoken to the leader directly about a particular decision can still make a call that clearly serves it. The test of a good vision statement is not how inspiring it sounds in a meeting, it is whether it actually changes what people do when no one is watching.",
    "## Values Are Tested by Cost, Not Words",
    "Every organization can write a values statement; the words themselves cost nothing. What actually determines whether a value is real is what happens the first time honoring it costs something concrete, a lost sale, a missed deadline, an uncomfortable conversation. A value that survives that moment becomes real to the people watching. A value that quietly gets set aside the first time it becomes expensive teaches everyone watching, more effectively than any statement could, that it was never a real value to begin with, just words on a wall.",
    "## The Pattern Over the Moment",
    "It is tempting to look for one defining moment that proves someone is a leader: the crisis handled well, the speech that rallied the team. Real leadership credibility is built almost entirely the opposite way, through an accumulated pattern of smaller, less dramatic moments that are consistent with each other over months and years. A single good decision can happen by luck. A sustained pattern, across many moments, under many different kinds of pressure, cannot.",
    "## Protecting Your Own Energy",
    "Because leadership is sustained over a long period rather than proven in a single moment, managing your own energy is not a personal indulgence separate from the work, it is part of the work. A depleted leader, running on too little rest, too little support, or too little recovery time, will eventually lead worse regardless of how skilled they are, because the emotional intelligence, patience, and clear communication this course has covered all degrade under sustained fatigue. Treating your own sustainability as a leadership responsibility, not an afterthought, is what allows the rest of this course to actually hold up over time."
  ],
  examples:[
    {title:"Example: Vision people can act on without you", text:"A product lead doesn't just say 'we want to be the best in our category.' She says, 'We win when a new user completes their first task in under two minutes, without help.' Months later, an engineer she has never spoken with about a specific feature makes a design call that clearly serves that goal, because the vision was concrete enough to guide decisions in her absence."},
    {title:"Example: A value tested by cost", text:"A company states that it values honesty with customers over short-term sales. During a slow quarter, a salesperson is tempted to overstate a product's capabilities to close a deal. The leader backs the team member who tells the truth and loses the sale, publicly reinforcing that the value holds even when it's expensive. The next quarter, three team members independently cite that moment as why they trust leadership."}
  ],
  takeaways:["Vision that's concrete enough lets people make good decisions without the leader present.","Values only mean something if they hold up when they're costly to keep.","A single good decision doesn't make a leader; a sustained pattern does.","Managing your own energy is part of sustaining leadership over time, not a personal luxury."],
  quiz:[
    {q:"According to the lesson, what makes someone a leader over time?", options:["A single impressive decision","A sustained pattern, not one moment","Their job title","How they are perceived in their first week"], correct:1},
    {q:"How does the lesson define vision?", options:["A vague, inspiring slogan","A concrete description of where the group is headed and why it matters, specific enough to guide decisions without the leader present","A five-year financial forecast","A list of company rules"], correct:1},
    {q:"In the first example, why could the engineer make a good design decision without consulting the product lead?", options:["The engineer guessed correctly by luck","The vision was concrete enough to clearly guide the decision","The engineer had a written rulebook for every situation","The product lead had approved that exact decision in advance"], correct:1},
    {q:"What does the lesson say happens to a stated value that's abandoned under pressure?", options:["It becomes stronger","It teaches people it was never really a value, just a slogan","Nobody notices or remembers","It has no effect on trust"], correct:1},
    {q:"In the second example, what did the leader do when honesty conflicted with a sale?", options:["Pressured the salesperson to close the deal anyway","Backed the team member who told the truth, even though it cost the sale","Fired the salesperson for losing the deal","Ignored the situation entirely"], correct:1},
    {q:"What was the effect of that decision, according to the lesson?", options:["Team members lost trust in leadership","Several team members later cited it as why they trust leadership","Sales improved immediately","There was no lasting effect"], correct:1},
    {q:"Why does the lesson connect managing your own energy to sustaining leadership?", options:["Energy management is unrelated to leadership quality","A depleted leader eventually leads worse, regardless of skill","Energetic leaders are always more likable","It only matters for physically demanding jobs"], correct:1},
    {q:"What is the risk of a vision that is too vague, like 'be the best in our category'?", options:["It's too specific for people to remember","It doesn't give people enough concrete guidance to act on it without the leader","It's always false","It makes decisions faster"], correct:1},
    {q:"What best distinguishes a real value from a slogan, per the lesson?", options:["How often it's repeated in meetings","Whether it's protected even when it costs something","How inspiring it sounds","Whether it's written down formally"], correct:1},
    {q:"Which best summarizes this final lesson's core idea?", options:["Leadership is proven in a single defining moment","Leadership that lasts depends on concrete vision, values that hold under pressure, and sustainable personal energy","Vision matters more than values in the long run","Leaders should avoid stating values publicly to avoid being tested"], correct:1}
  ]
}

  reading:[
    "Strategic decision-making is not the same as having an opinion quickly. It is the disciplined practice of choosing a direction when the future is uncertain, resources are limited, and several options could work. The decision-maker's job is to create enough clarity for action without pretending that uncertainty can be removed.",
    "A strong decision has three parts: a clear choice, a reasoned basis, and an owner for what happens next. If a meeting ends with agreement but nobody knows who will act, the group has produced conversation rather than a decision.",

    "Leaders often delay because they want a forecast that is guaranteed to be right. That standard is impossible. A decision is a bet made with the best information available at a particular time, not a promise that the outcome will be perfect. Good decision-makers make the bet visible, so others can understand and improve it.",
    "## Make the Decision Legible",

    "## Own the Consequences",
    "Ownership does not mean taking personal blame for every external event. It means being accountable for the quality of the process, communicating the choice, watching the signals that matter, and changing course when the evidence warrants it. A leader who owns the decision creates learning instead of defensiveness."

    {q:"Which three parts make a decision actionable?", options:["A long report, a vote, and a deadline","A clear choice, a reasoned basis, and an owner for next steps","A forecast, a budget, and a presentation","A leader, a committee, and a meeting"], correct:1},
    {q:"Why is a decision not the same as a forecast?", options:["Forecasts are always useless","A decision is a bet made with the best information available, not a guarantee","Decisions never use evidence","Forecasts are only for finance teams"], correct:1},
    {q:"What problem does a legible decision prevent?", options:["People becoming too creative","Confusion, duplicated analysis, and quiet disagreement","The need for any follow-up","All external risks"], correct:1},
    {q:"In the nonprofit example, what made the expansion discussion a real decision?", options:["The director ended the meeting early","The pilot, owner, budget limit, and review measures were specified","Everyone agreed the service was valuable","The team produced a longer report"], correct:1},
    {q:"What does decision ownership require?", options:["Guaranteeing the outcome","Watching relevant signals, communicating the choice, and adapting when warranted","Taking blame for every external event","Never changing course"], correct:1},
    {q:"What should be visible in a useful decision record?", options:["Only the final answer","The question, options, criteria, and review point","Every thought anyone had","The most senior person's preference"], correct:1},
    {q:"What happens when a meeting ends with agreement but no owner?", options:["Execution becomes automatic","The group has produced conversation rather than a decision","The decision becomes more strategic","Risk disappears"], correct:1},

},
{
  id:"s2", title:"Frame the Real Problem", desc:"Turning a noisy situation into a decision question worth answering.",
  reading:[
    "Many poor decisions are answers to the wrong question. A team sees falling sales and immediately asks how to sell more, even though the actual constraint may be retention, pricing, product fit, or a weak distribution channel. Before comparing options, define what must genuinely be solved.",
    "Problem framing is not wordplay. The frame determines what evidence gets collected, which options seem reasonable, and how success will be recognized. A narrow frame can hide the biggest lever; an overly broad frame can make action impossible.",
    "## Separate Symptoms from Causes",
    "A symptom is what is visible: missed targets, a backlog, complaints, or low morale. A cause is the mechanism producing it. The first explanation that feels plausible is not necessarily the cause. Ask what changed, where the pattern is concentrated, and what would have to be true for the symptom to appear.",
    "## Define the Decision Boundary",
    "A useful frame states what is inside the decision and what is not. 'How do we fix the business?' is too broad. 'Which two retention interventions should we test in the next six weeks, given a $12,000 budget?' creates a boundary that supports useful work.",
    "## Use a Counterfactual",
    "One way to test a frame is to ask what would be different if the presumed cause disappeared. If removing a feature would not improve the outcome, the feature may be a distraction. Good frames point toward a mechanism that can be influenced, measured, and reviewed."
  ],
  examples:[
    {title:"Example: The backlog is not the problem", text:"A support team assumes customers are unhappy because response times are slow. A closer look shows that most repeat contacts come from one confusing billing message. Rewriting that message reduces volume more than adding agents would have, because the team framed the cause rather than the visible backlog."},
    {title:"Example: A bounded strategic question", text:"Instead of asking 'Should we go international?', a founder asks, 'Which one of our three existing products has enough demand in one neighboring market to justify a 90-day test, and what evidence would stop us?' The new question is narrower, but it creates a decision the team can actually investigate."}
  ],
  takeaways:["A visible symptom is not automatically the problem to solve.","The frame controls evidence, options, and how success is judged.","Bound the decision by time, resources, and scope.","A good frame points to a mechanism that can be influenced and measured."],
  quiz:[
    {q:"Why do many poor decisions happen?", options:["Teams have too much data","They answer the wrong question","Leaders always move too quickly","Options are never available"], correct:1},
    {q:"Which is a symptom rather than a cause?", options:["A confusing billing message","A backlog of support tickets","A broken distribution channel","Low product fit"], correct:1},
    {q:"What does a decision boundary do?", options:["Makes every issue part of the decision","States what is inside the decision and what is outside it","Guarantees the chosen option","Removes the need for evidence"], correct:1},
    {q:"Why is 'How do we fix the business?' a weak frame?", options:["It is too specific","It is too broad to guide useful action","It includes a measurable budget","It identifies one test"], correct:1},
    {q:"In the support example, what was the real source of repeat contacts?", options:["Too few agents","A confusing billing message","Low employee morale","Slow internet"], correct:1},
    {q:"What question helps test whether a presumed cause matters?", options:["Who has the highest title?","What would be different if the presumed cause disappeared?","Can we avoid making a decision?","Which option sounds most exciting?"], correct:1},
    {q:"Why can a narrow frame be useful?", options:["It hides important evidence","It creates a decision that can be investigated and acted on","It guarantees a small outcome","It prevents strategic thinking"], correct:1},
    {q:"What should a strong problem frame include?", options:["A mechanism that can be influenced, measured, and reviewed","A promise that the answer will work","Every possible future issue","Only the symptom"], correct:0},
    {q:"What did the founder change in the international expansion example?", options:["He abandoned expansion","He turned a broad question into a bounded 90-day test","He chose all three products","He removed the need for evidence"], correct:1},
    {q:"Which best summarizes the lesson?", options:["Start with the first explanation","Frame the real, bounded problem before comparing solutions","Broad questions produce better decisions","Symptoms and causes are interchangeable"], correct:1}
  ]
},
{
  id:"s3", title:"Objectives and Decision Criteria", desc:"Defining what a good outcome means before preferences take over.",
  reading:[
    "A team cannot choose well if it has not agreed what 'better' means. Decision criteria translate a vague objective into the dimensions that matter: customer value, speed, cost, risk, quality, reach, or capability. The point is not to create fake precision. It is to make trade-offs discussable.",
    "Start with the objective, not with a favorite option. An objective describes the outcome you want; a criterion describes how you will compare paths toward it. 'Launch a reliable service for small businesses' is an objective. Reliability, adoption, implementation effort, and margin may be criteria.",
    "## Distinguish Must-Haves from Preferences",
    "Some criteria are gates. If a solution cannot meet a legal, safety, or minimum service requirement, it should not advance. Other criteria are preferences that help rank viable options. Mixing the two lets a polished but unacceptable option win on attractive secondary features.",
    "## Weight What Truly Matters",
    "Not every criterion deserves equal influence. Weighting is useful when the team can explain why one dimension matters more than another. The numbers are not objective truth; they are a transparent representation of priorities that can be challenged.",
    "## Keep Criteria Independent",
    "Criteria should describe meaningfully different concerns. If speed and time-to-launch measure the same thing, counting both can accidentally double their influence. A short list of distinct criteria is usually stronger than a long checklist that creates the appearance of rigor."
  ],
  examples:[
    {title:"Example: The cheapest option loses", text:"A clinic compares two scheduling systems. The cheaper system has poor accessibility and no reliable reminder feature, both of which are minimum requirements. The team rejects it before scoring optional features, because price cannot compensate for failing a must-have."},
    {title:"Example: A transparent weighting", text:"A logistics team weights delivery reliability at 40%, total cost at 30%, implementation speed at 20%, and reporting quality at 10%. A skeptical teammate can disagree with the weights, but the disagreement is visible and specific rather than hidden inside a loud preference."}
  ],
  takeaways:["Objectives describe desired outcomes; criteria compare routes to those outcomes.","Separate must-have gates from preferences.","Weights make priorities visible, not objectively true.","Avoid counting the same concern twice under different names."],
  quiz:[
    {q:"What is the purpose of decision criteria?", options:["To make choices look complicated","To translate a vague objective into comparable dimensions","To guarantee consensus","To replace judgment entirely"], correct:1},
    {q:"Which is an objective rather than a criterion?", options:["Implementation effort","Launch a reliable service for small businesses","Adoption rate","Total cost"], correct:1},
    {q:"What is a must-have criterion?", options:["An attractive optional feature","A minimum requirement that an option must meet to advance","The least important preference","A score assigned after the decision"], correct:1},
    {q:"Why should must-haves be separated from preferences?", options:["So unacceptable options cannot win on secondary features","So the team can avoid discussing priorities","So every criterion has equal weight","So price always wins"], correct:0},
    {q:"What do weights represent?", options:["Objective universal truth","A transparent representation of the team's priorities","A guarantee of success","The number of people in the meeting"], correct:1},
    {q:"What risk comes from duplicate criteria?", options:["The decision becomes reversible","One concern can accidentally receive double influence","The team gets more evidence","Must-haves become clearer"], correct:1},
    {q:"In the clinic example, why was the cheaper system rejected?", options:["It had too many features","It failed minimum accessibility and reminder requirements","The vendor was unfamiliar","The team disliked its interface"], correct:1},
    {q:"What makes weighting useful?", options:["Nobody can challenge the numbers","The team can explain why one dimension matters more","It eliminates trade-offs","It ensures every option ties"], correct:1},
    {q:"Which sequence is strongest?", options:["Choose an option, then invent criteria","Define the objective, identify criteria, then compare options","Rank preferences, then define the problem","Score every possible feature equally"], correct:1},
    {q:"Which best summarizes the lesson?", options:["Good decisions come from choosing favorites early","Clear objectives and distinct, prioritized criteria make trade-offs visible","Every criterion should be weighted equally","Numbers remove the need for judgment"], correct:1}
  ]
},
{
  id:"s4", title:"Evidence, Assumptions, and Uncertainty", desc:"Using information to improve a choice without waiting for perfect knowledge.",
  reading:[
    "Evidence is valuable because it reduces uncertainty about a decision, not because having more of it is inherently good. A hundred pages of research that does not change the choice are less useful than one observation that reveals the key constraint.",
    "Every strategic choice contains assumptions. An assumption is something that must be true for the choice to work, but is not yet established. Naming assumptions allows the team to ask which ones are both important and testable.",
    "## Match Evidence to the Claim",
    "Evidence should answer the question being asked. Customer interviews may reveal motivations but not market size. A spreadsheet may show historical behavior but not why it happened. Be precise about what a source can and cannot establish.",
    "## Separate Signal from Noise",
    "A signal is information that changes your estimate of what is likely or valuable. Noise is information that feels interesting but does not materially affect the decision. The test is practical: if this fact changed, would we choose differently?",
    "## Use Ranges, Not False Certainty",
    "When the inputs are uncertain, ranges and scenarios are more honest than a single precise number. Ask what would happen in a downside, expected, and upside case, and identify which variable has the most influence. That variable deserves the next investigation."
  ],
  examples:[
    {title:"Example: The interview cannot answer everything", text:"A team interviews ten customers and hears strong enthusiasm for a new reporting feature. That is evidence of a problem worth exploring, not proof that thousands will pay for the feature. The team pairs the interviews with a pricing test before committing the full build."},
    {title:"Example: The assumption that mattered", text:"A retailer considers opening a new location. The business case depends mostly on weekday foot traffic, not on the exact cost of paint. The team counts pedestrians during comparable weeks before spending time polishing minor estimates."}
  ],
  takeaways:["Good evidence reduces uncertainty about a specific decision.","Name assumptions so important, testable ones receive attention.","Different sources answer different kinds of claims.","Use scenarios and ranges when precision would be misleading."],
  quiz:[
    {q:"Why is evidence valuable?", options:["Because more information is always better","Because it reduces uncertainty about a decision","Because it prevents all mistakes","Because it makes meetings longer"], correct:1},
    {q:"What is an assumption?", options:["A fact verified by multiple sources","Something that must be true for a choice to work but is not yet established","A final decision","A personal preference"], correct:1},
    {q:"What can customer interviews reveal especially well?", options:["Exact market size","Customer motivations and problems","Future revenue with certainty","All operational costs"], correct:1},
    {q:"What practical test separates signal from noise?", options:["Is the information surprising?","If this fact changed, would we choose differently?","Did a senior person mention it?","Can it fill a slide?"], correct:1},
    {q:"Why use ranges instead of one precise number?", options:["To hide weak analysis","Because uncertain inputs make false precision misleading","To avoid making a decision","Because numbers are irrelevant"], correct:1},
    {q:"In the reporting example, what did interviews not prove?", options:["That customers had a problem","That thousands of customers would pay","That the feature was worth exploring","That further testing was needed"], correct:1},
    {q:"Which assumption deserved attention in the retailer example?", options:["The exact paint cost","Weekday foot traffic","The color of the sign","The team's presentation style"], correct:1},
    {q:"What should receive the next investigation?", options:["The easiest variable to measure","The variable with the most influence on the decision","The most interesting anecdote","A fact that cannot change the choice"], correct:1},
    {q:"What does evidence not automatically provide?", options:["Information","A perfect prediction or guaranteed outcome","A way to update a belief","A clearer question"], correct:1},
    {q:"Which best summarizes the lesson?", options:["Collect all available information before acting","Use claim-matched evidence to test important assumptions and focus on what could change the choice","Interviews prove demand","Precise numbers are always more honest"], correct:1}
  ]
},
{
  id:"s5", title:"Generate Real Alternatives", desc:"Escaping the false choice between the first idea and doing nothing.",
  reading:[
    "A decision with one visible option is usually not a decision yet. It is a proposal waiting for approval. Strategic thinkers create alternatives because comparison exposes assumptions, reveals trade-offs, and reduces attachment to the first idea that sounded plausible.",
    "Alternatives should be meaningfully different paths, not minor variations in wording. Include the status quo, a smaller test, a staged investment, a partnership, and sometimes the option to stop. Doing nothing is not neutral; it has its own cost and risk.",
    "## Use Constraints as Design Material",
    "A tight budget or short timeline can make a team feel trapped, but constraints can improve the quality of alternatives. They push the team toward pilots, sequencing, narrower audiences, or shared resources instead of an all-or-nothing launch.",
    "## Look for a Reversible Test",
    "When the team is uncertain, an alternative that buys learning can be more valuable than a large commitment. A good test has a clear hypothesis, a bounded investment, a measurable signal, and a decision rule for what happens next.",
    "## Avoid the Straw-Man Alternative",
    "Do not compare a carefully designed proposal with an obviously weak alternative. The point is not to win a debate; it is to improve the choice. Give each serious option a fair description of its upside, downside, and conditions for success."
  ],
  examples:[
    {title:"Example: Beyond build or abandon", text:"A company wants a new customer portal. Instead of choosing between a full build and abandonment, the team considers a no-code pilot for one customer segment, integrating an existing vendor, and improving the highest-volume support workflow first. The alternatives reveal different ways to learn."},
    {title:"Example: A decision rule for a pilot", text:"A communications team tests two newsletter formats with a 5,000-subscriber sample. If the new format improves qualified click-through by at least 15% without increasing unsubscribes beyond one percentage point, it becomes the default. The test is useful because the next decision is defined in advance."}
  ],
  takeaways:["One visible option is a proposal, not a robust decision.","Include the status quo, smaller tests, staged paths, and stopping options.","Constraints can generate better, more focused alternatives.","A learning test needs a hypothesis, bounded investment, signal, and decision rule."],
  quiz:[
    {q:"Why generate multiple alternatives?", options:["To delay the decision","To expose assumptions and trade-offs","To make consensus impossible","To prove the first idea is wrong"], correct:1},
    {q:"What should a serious alternative set usually include?", options:["Only the preferred option","The status quo, a smaller test, staged paths, and sometimes stopping","Only expensive options","Options that are identical"], correct:1},
    {q:"Why is doing nothing not neutral?", options:["It has its own cost and risk","It always succeeds","It requires the largest budget","It cannot be compared"], correct:0},
    {q:"How can constraints help?", options:["They prevent creativity","They encourage pilots, sequencing, and focused audiences","They guarantee low quality","They remove the need for options"], correct:1},
    {q:"What makes a learning test useful?", options:["A large irreversible commitment","A clear hypothesis, bounded investment, measurable signal, and decision rule","A persuasive presentation","No defined next step"], correct:1},
    {q:"In the portal example, which was an alternative to a full build?", options:["Ignoring customers","A no-code pilot for one customer segment","Hiring more executives","Removing all support"], correct:1},
    {q:"What is a straw-man alternative?", options:["A serious option with clear trade-offs","An obviously weak option designed to make another option win","A reversible pilot","The status quo"], correct:1},
    {q:"Why define a decision rule before a pilot?", options:["To guarantee the result","To make clear what evidence will trigger the next action","To avoid measuring anything","To prevent learning"], correct:1},
    {q:"Which is a meaningfully different path?", options:["Renaming the same plan","Partnering with an existing vendor instead of building internally","Changing the slide color","Repeating the preferred option"], correct:1},
    {q:"Which best summarizes the lesson?", options:["The first good idea is usually enough","Generate fair, meaningfully different alternatives, especially options that buy learning","Alternatives only create confusion","A test is useful without a decision rule"], correct:1}
  ]
},
{
  id:"s6", title:"Trade-offs and Prioritization", desc:"Choosing what to protect when every goal cannot be maximized.",
  reading:[
    "Strategy becomes real when a team chooses what it will not do. Resources, attention, and time are finite, so an organization that claims every priority is urgent has not prioritized; it has transferred the conflict into execution.",
    "A trade-off is not a failure to find a clever enough solution. It is a statement that improving one dimension may require accepting less of another. Naming the sacrifice helps people coordinate and prevents the team from quietly promising incompatible outcomes.",
    "## Use the Constraint as the Starting Point",
    "Ask which resource or condition is currently limiting progress. It may be engineering capacity, cash, trust, decision speed, or customer attention. Improving a non-constraint can create activity without improving the result.",
    "## Distinguish Importance from Urgency",
    "Urgent work demands attention now; important work affects the outcome that matters. A loud request can be urgent without being strategically important. Use the objective and criteria to decide what deserves scarce capacity.",
    "## Make the Cost of Choice Explicit",
    "A useful prioritization statement says what is first, what is later, and what will not be pursued for now. This lets people disagree with the choice directly, instead of reopening it through side requests and exceptions."
  ],
  examples:[
    {title:"Example: Protecting the constraint", text:"A small software team debates polishing three screens while customers wait for an unreliable data import. The team prioritizes the import because it is the constraint preventing activation. The visual improvements are not worthless; they are simply not the highest-leverage use of the next sprint."},
    {title:"Example: The cost made explicit", text:"A school chooses to offer fewer electives next term so it can guarantee smaller class sizes in core subjects. The principal explains the trade-off publicly: breadth will temporarily decrease to protect learning support. Families can debate the choice, but they are not left guessing about it."}
  ],
  takeaways:["Real strategy includes explicit choices about what not to do.","Find the constraint before optimizing other activities.","Importance and urgency are different dimensions.","State what is first, later, and out of scope for now."],
  quiz:[
    {q:"What does a team without clear priorities do?", options:["Maximizes every goal","Transfers conflict into execution","Always moves faster","Removes trade-offs"], correct:1},
    {q:"What is a trade-off?", options:["Proof of poor creativity","Accepting less of one dimension to improve another","A way to avoid choosing","A guarantee that all goals improve"], correct:1},
    {q:"Why find the current constraint?", options:["To optimize the resource limiting progress","To make every activity urgent","To avoid measuring outcomes","To choose the most popular task"], correct:0},
    {q:"How are importance and urgency different?", options:["They are identical","Urgency demands attention now; importance affects the outcome that matters","Importance is always louder","Urgency always wins strategically"], correct:1},
    {q:"What should a useful prioritization statement include?", options:["Only what is exciting","What is first, later, and not pursued for now","Every possible request","A promise to do everything"], correct:1},
    {q:"Why did the software team prioritize the data import?", options:["It was the prettiest improvement","It was the constraint preventing activation","It was the easiest task","Customers requested new colors"], correct:1},
    {q:"What did the school protect by offering fewer electives?", options:["More variety","Smaller core class sizes and learning support","A larger budget for events","Faster scheduling"], correct:1},
    {q:"What happens when sacrifices stay unnamed?", options:["Coordination improves","People quietly promise incompatible outcomes","The strategy becomes clearer","Exceptions disappear"], correct:1},
    {q:"Which request can be urgent but not strategically important?", options:["A loud request that does not affect the main objective","A constraint-breaking fix","A required safety issue","A key objective"], correct:0},
    {q:"Which best summarizes the lesson?", options:["Every goal should be called a priority","Strategic prioritization protects the main objective by making constraints and sacrifices explicit","Urgency is the same as importance","Trade-offs should stay hidden to preserve morale"], correct:1}
  ]
},
{
  id:"s7", title:"Bias, Dissent, and Better Judgment", desc:"Improving decisions by making disagreement useful instead of personal.",
  reading:[
    "Bias is not a defect found only in other people. It is the predictable way attention and judgment are shaped by incentives, recent events, status, emotion, and the first story we hear. Strategic teams design practices that make these influences easier to notice.",
    "Dissent is valuable when it tests the decision rather than attacks the decision-maker. A team that cannot challenge a plan will often produce false agreement, followed by expensive surprise when concerns emerge too late.",
    "## Slow Down the First Story",
    "The first explanation creates an anchor. Before debating a proposed solution, ask what evidence would disconfirm it and what a reasonable alternative explanation might be. This is especially important when a vivid recent event is dominating attention.",
    "## Invite the Independent View",
    "If people speak in order of seniority, later speakers may unconsciously follow the first confident opinion. Collect independent views before discussion, or ask the most junior person for their read first. The goal is not ceremony; it is to preserve information that hierarchy can suppress.",
    "## Use a Premortem",
    "A premortem asks the team to imagine that the decision failed and list the reasons. It converts vague unease into specific risks and often surfaces operational details that optimistic planning overlooks. It is a challenge to the plan, not a prediction of failure."
  ],
  examples:[
    {title:"Example: Independent estimates", text:"Before discussing a project timeline, six team members write their estimates privately. The answers range from four to twelve weeks. Instead of averaging away the disagreement, the lead asks what assumptions create the range and discovers that testing requirements were missing from the fastest estimates."},
    {title:"Example: A useful premortem", text:"A retailer imagines that its holiday campaign failed. The team lists stockouts, unclear delivery promises, and an audience segment that never saw the offer. The campaign is adjusted before launch, not because failure is certain, but because the exercise made preventable risks visible."}
  ],
  takeaways:["Bias is predictable, so decision processes should account for it.","Healthy dissent tests a plan without attacking a person.","Independent input before discussion reduces anchoring and hierarchy effects.","A premortem turns vague concern into specific, actionable risks."],
  quiz:[
    {q:"How does the lesson describe bias?", options:["A defect only other people have","A predictable influence on attention and judgment","A sign that a decision is impossible","A technical error"], correct:1},
    {q:"What makes dissent useful?", options:["It attacks the decision-maker","It tests the decision and surfaces risks","It prevents any decision","It ensures the dissenting person wins"], correct:1},
    {q:"What effect can the first story have?", options:["It removes uncertainty","It creates an anchor that shapes later judgment","It guarantees the right cause","It makes alternatives stronger"], correct:1},
    {q:"Why collect independent views before discussion?", options:["To preserve information that hierarchy or confidence can suppress","To avoid hearing explanations","To force identical answers","To make seniority irrelevant"], correct:0},
    {q:"What is a premortem?", options:["A celebration after success","Imagining a decision failed and listing why","A vote by senior leaders","A financial forecast"], correct:1},
    {q:"In the timeline example, why was the range valuable?", options:["It proved nobody understood the work","It revealed different assumptions, including missing testing requirements","It let the lead choose the shortest estimate","It removed the need for planning"], correct:1},
    {q:"What did the retailer's premortem surface?", options:["Only positive outcomes","Stockouts, unclear delivery promises, and weak audience reach","A guaranteed failure","A new company strategy"], correct:1},
    {q:"Which practice helps reduce anchoring?", options:["Debating the first proposal immediately","Asking what evidence would disconfirm the first explanation","Letting the most senior person speak first","Ignoring alternatives"], correct:1},
    {q:"What is a premortem primarily for?", options:["Proving failure is certain","Making preventable risks visible before action","Replacing execution","Assigning blame"], correct:1},
    {q:"Which best summarizes the lesson?", options:["Good judgment comes from confidence alone","Use independent input, respectful dissent, and premortems to expose what a fast consensus may miss","Dissent is harmful to speed","Bias disappears when people work hard"], correct:1}
  ]
},
{
  id:"s8", title:"Speed, Reversibility, and Risk", desc:"Matching the decision process to the cost of being wrong.",
  reading:[
    "Not every decision deserves the same amount of analysis. The right question is not simply how important a decision feels, but how reversible it is, how costly error would be, and how quickly new information will arrive.",
    "A reversible decision can be changed at reasonable cost. An irreversible decision closes doors, creates obligations, or exposes people to serious harm. Reversible choices should move quickly enough to generate learning; irreversible choices deserve stronger evidence, broader input, and explicit safeguards.",
    "## Use Two-Way and One-Way Doors",
    "A two-way door is easy to walk back through. A one-way door is difficult or impossible to reverse. Teams get into trouble when they treat every two-way door like a one-way door and spend weeks analyzing a small experiment, or when they rush through a decision that creates long-term commitments.",
    "## Risk Is More Than Probability",
    "Risk combines likelihood and impact. A low-probability event may still require attention if the impact is severe. Consider who bears the downside, whether the harm can be detected early, and what safeguards reduce exposure.",
    "## Set a Time Box",
    "A time box gives analysis a defined limit and a clear output. It prevents research from expanding to fill the available time while still protecting the quality needed for the decision. At the end of the time box, decide, test, or explicitly request more evidence."
  ],
  examples:[
    {title:"Example: Move fast on a two-way door", text:"A team is choosing between two internal collaboration tools for a ten-person pilot. Both can be canceled monthly, and the data can be exported. The team chooses one after a short comparison and schedules a review after four weeks instead of spending a quarter seeking certainty."},
    {title:"Example: Slow down for a one-way door", text:"A manufacturer considers a chemical process that would require a large facility conversion. The leadership team brings in safety expertise, tests failure modes, and defines stop conditions before approving the investment. The slower process fits the cost of being wrong."}
  ],
  takeaways:["Match analysis effort to reversibility, impact, and the speed of new information.","Two-way doors can often become experiments; one-way doors need stronger safeguards.","Risk includes both likelihood and impact, plus who bears the downside.","Time boxes prevent analysis from expanding without limit."],
  quiz:[
    {q:"What should determine how much analysis a decision receives?", options:["How senior the decision-maker is","Reversibility, cost of error, and speed of new information","How long the meeting is","Whether the option is popular"], correct:1},
    {q:"What is a reversible decision?", options:["One that can be changed at reasonable cost","One that can never be changed","One with no risk","One that requires no owner"], correct:0},
    {q:"What is a one-way door?", options:["A decision that creates difficult or irreversible commitments","A small experiment","A monthly subscription","A decision with no consequences"], correct:0},
    {q:"Why can two-way doors move faster?", options:["They are always unimportant","They can be changed at reasonable cost and can generate learning","They require no evidence","They cannot fail"], correct:1},
    {q:"What does risk combine?", options:["Popularity and speed","Likelihood and impact","Confidence and status","Cost and presentation quality"], correct:1},
    {q:"Why consider who bears the downside?", options:["To hide the risk","Because impact is not distributed equally and safeguards may be needed","To ensure leaders bear none of it","Because probability does not matter"], correct:1},
    {q:"What is a time box?", options:["An unlimited research period","A defined limit for analysis with a clear output","A way to postpone a decision","A financial reserve"], correct:1},
    {q:"In the collaboration-tool example, why did the team move quickly?", options:["The tools were irreversible","The pilot could be canceled and data exported","There was no review point","The choice had severe safety impact"], correct:1},
    {q:"Why did the manufacturer slow down?", options:["The investment created a large, difficult-to-reverse commitment","The team disliked experiments","The decision was trivial","New information was irrelevant"], correct:0},
    {q:"Which best summarizes the lesson?", options:["Every decision deserves the same process","Move quickly on reversible choices and use stronger evidence and safeguards for irreversible ones","Always decide immediately","Avoid all risk before acting"], correct:1}
  ]
},
{
  id:"s9", title:"From Decision to Execution", desc:"Turning a strategic choice into coordinated action and visible progress.",
  reading:[
    "A decision creates value only when it changes what people do. The handoff from choosing to executing is where many strategies quietly fail: priorities remain vague, dependencies are missed, and people interpret the same decision in different ways.",
    "Execution starts with a translation layer. State the outcome, the first actions, the owner of each action, the boundaries, the dependencies, and the signal that will show whether progress is real. This is not bureaucracy; it is how intent becomes coordinated behavior.",
    "## Communicate the Why and the What",
    "People need both the direction and the reasoning that makes it coherent. The why helps them make local decisions; the what gives them a concrete next move. Communication should also name what is not changing, so the decision does not create unnecessary uncertainty.",
    "## Design the First Step",
    "The first step should be small enough to start quickly and meaningful enough to test the decision. If the first step requires a perfect plan, the strategy has not been translated into action yet.",
    "## Review Leading Signals",
    "Lagging outcomes may take months to appear. Leading signals show whether the mechanism is beginning to work: adoption, cycle time, quality checks, or customer behavior. Review them at a defined cadence, and decide in advance what would trigger adjustment."

  examples:[

{
  id:"c8", title:"Stories, Evidence, and Executive Communication", desc:"Helping decision-makers see the meaning and consequence of information.",
  reading:[
    "Executive communication is not a performance of certainty. It is a disciplined way to help a decision-maker understand what matters, what the evidence supports, what remains uncertain, and what choice is recommended.",
    "A useful story gives information a shape: situation, change or tension, evidence, implication, and decision. The story should not dramatize weak evidence. It should make the consequence of the evidence easier to see.",
    "## Lead With the Decision",
    "Senior audiences often have limited time and broad responsibility. Start with the recommendation or decision needed, then explain the most important reasons and risks. Put supporting analysis behind the headline so a reader can go deeper without searching for the point.",

  id:"c10", title:"Communicating Through Change and Uncertainty", desc:"Keeping people oriented when the full answer is not available yet.",
  reading:[
    "During change, people are not only asking what will happen. They are asking what it means for them, what remains stable, when they will know more, and whether it is safe to raise concerns. Silence creates a vacuum that speculation fills.",
    "Leaders cannot always provide a complete answer, but they can provide honest orientation. Say what is known, what is not known, what is being decided, what will remain the same, and when the next update will come.",
    "## Repeat the Message Without Pretending Nothing Changed",
    "People need repetition during uncertainty because they are processing information while doing their normal work. Repeat the core facts, update what changed, and correct earlier assumptions plainly. Consistency means being reliable about truth, not repeating outdated words.",
    "## Make Questions and Bad News Safe",
    "A change plan is incomplete if people cannot surface risks. Thank people for early warnings, distinguish a problem from the person reporting it, and make the escalation path visible. Leaders who punish uncertainty receive silence until the uncertainty becomes expensive."
  ],
  examples:[
    {title:"Example: Honest orientation", text:"A leader says, 'The reporting line will change on 1 October. We have not decided the new team structure yet. Customer commitments and current salaries remain unchanged. I will share the structure by 15 September, and questions can come to the weekly open session.' People still face uncertainty, but they have anchors."},
    {title:"Example: Correct the record", text:"A manager previously said a vendor deadline was secure, then learns the date is at risk. She says, 'I was too confident in my earlier update. The date is now at risk because testing is incomplete. Here is the containment plan, and I will update you tomorrow.' Trust is strengthened by the correction."}
  ],
  takeaways:["During change, people need facts, meaning, stability, timing, and a safe way to raise concerns.","Name what is known, unknown, being decided, unchanged, and next.","Consistency means updating the truth reliably, not repeating outdated statements.","Early warnings should be thanked and routed before uncertainty becomes expensive."],
  quiz:[
    {q:"What does silence during change often create?", options:["Perfect clarity","A vacuum that speculation fills","Automatic trust","A final decision"], correct:1},
    {q:"What can leaders provide when they do not have a complete answer?", options:["False certainty","Honest orientation about knowns, unknowns, decisions, stability, and timing","No information","A promise that nothing will change"], correct:1},
    {q:"Why do people need repetition during uncertainty?", options:["They are processing information while continuing normal work","They cannot learn","Leaders should avoid updates","Repetition hides changes"], correct:0},
    {q:"What does consistency mean during change?", options:["Repeating outdated words","Being reliable about truth while updating what changed","Never admitting an error","Avoiding questions"], correct:1},
    {q:"Why should early warnings be safe to share?", options:["They allow risks to be contained while options remain","They remove all accountability","They guarantee the warning is correct","They keep leaders uninformed"], correct:0},
    {q:"What anchors did the reporting-line message provide?", options:["A complete team structure","What changes, what stays the same, a decision date, and a question path","A promise that nobody would worry","Only a new title"], correct:1},
    {q:"Why did the manager's correction strengthen trust?", options:["She hid the earlier update","She acknowledged overconfidence, named the new risk, and gave a containment plan","She blamed the vendor","She stopped communicating"], correct:1},

    {q:"What happens when uncertainty is punished?", options:["People share information earlier","People stay silent until uncertainty becomes more expensive","Risks disappear","Decisions improve automatically"], correct:1},
    {q:"Which best summarizes the lesson?", options:["Leaders should wait for complete certainty","Strong change communication gives honest orientation, repeats updated facts, and makes questions and warnings safe","Change communication should promise stability","Speculation is unavoidable and cannot be influenced"], correct:1}

function escapeHtml(value){
  return String(value == null ? "" : value).replace(/[&<>"']/g, char => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[char]));
}

function copyAccountNumber(value, btn){
  const done = () => {
    if(!btn) return;
    const original = btn.dataset.label || btn.textContent;
    btn.dataset.label = original;
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    clearTimeout(btn._copyResetTimer);
    btn._copyResetTimer = setTimeout(() => {
      btn.textContent = original;
      btn.classList.remove("copied");
    }, 1500);
  };
  const fallback = () => {
    try{
      const el = document.createElement("textarea");
      el.value = value;
      el.style.position = "fixed";
      el.style.opacity = "0";
      document.body.appendChild(el);
      el.focus();
      el.select();
      document.execCommand("copy");
      document.body.removeChild(el);
      done();
    }catch(e){
      /* copy not supported; silently ignore */
    }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(value).then(done).catch(fallback);
  }else{
    fallback();
  }
}

function getStorage(){
  try{
    return typeof window !== "undefined" && window.localStorage ? window.localStorage : null;
  }catch(e){
    return null;
  }
}

function readStoredProgress(key){
  const storage = getStorage();
  if(!storage) return null;
  try{
    const raw = storage.getItem(key);
    if(!raw) return null;
    const parsed = JSON.parse(raw);
    return isRecord(parsed) ? parsed : null;
  }catch(e){
    console.warn("GBLU Academy could not read saved progress.", e);
    return null;
  }
}

function normalizeCourseProgress(raw){
  const base = createCourseProgress();
  if(!isRecord(raw)) return base;
  const completed = isRecord(raw.completed) ? raw.completed : {};
  const quizAnswers = isRecord(raw.quizAnswers) ? raw.quizAnswers : {};
  const quizLocked = isRecord(raw.quizLocked) ? raw.quizLocked : {};
  const lessonScores = isRecord(raw.lessonScores) ? raw.lessonScores : {};
  const finalResults = isRecord(raw.finalResults) ? {...raw.finalResults} : {};
  Object.keys(lessonScores).forEach(lessonId => {
    if(quizLocked[lessonId] && !isRecord(finalResults[lessonId])){
      const score = Number(lessonScores[lessonId]);
      if(Number.isFinite(score)) finalResults[lessonId] = {score, finalizedAt:"legacy"};
    }
  });
  return {
    ...base,
    unlocked: raw.unlocked === true,
    completed,
    name: typeof raw.name === "string" ? raw.name : "",
    quizAnswers,
    quizLocked,
    lessonScores,
    finalResults,
    certificateGenerated: raw.certificateGenerated === true && typeof raw.certificateId === "string" && raw.certificateId.length > 0,
    certificateName: typeof raw.certificateName === "string" ? raw.certificateName : "",
    certificateDate: typeof raw.certificateDate === "string" ? raw.certificateDate : "",
    certificateScore: Number.isFinite(Number(raw.certificateScore)) ? Number(raw.certificateScore) : null,
    certificateId: typeof raw.certificateId === "string" ? raw.certificateId : "",
    quizConfirming: {},
    certNameError: ""
  };
}

function currencyForCountry(country){
  const normalized = String(country || "").trim().toLowerCase();
  if(COUNTRY_CURRENCIES[normalized]) return COUNTRY_CURRENCIES[normalized];
  const option = COUNTRY_OPTIONS.find(item => item[0].toLowerCase() === normalized);
  if(!option) return {code:"USD", rate:1};
  return {code:option[1], rate:CURRENCY_RATES[option[1]] || 1};
}

function coursePrice(courseId, country){
  const baseUsd = courseId === "core" ? 5 : 2;
  const normalizedCountry = String(country || "").trim().toLowerCase();
  if(normalizedCountry === "ethiopia"){
    return {amount:courseId === "core" ? 600 : 200, code:"ETB", label:"birr", local:true};
  }
  const currency = currencyForCountry(country);
  return {amount:currency.code === "JPY" || currency.code === "KRW" ? Math.round(baseUsd * currency.rate) : Math.round(baseUsd * currency.rate * 100) / 100, code:currency.code, baseUsd, local:false};
}

// The "before discount" price, shown struck through next to the real price.
// Core Five: $6 / 1000 birr → $5 / 600 birr. Every other course: $3 / 300 birr → $2 / 200 birr.
function coursePriceOriginal(courseId, country){
  const baseUsd = courseId === "core" ? 6 : 3;
  const normalizedCountry = String(country || "").trim().toLowerCase();
  if(normalizedCountry === "ethiopia"){
    return {amount:courseId === "core" ? 1000 : 300, code:"ETB", label:"birr", local:true};
  }
  const currency = currencyForCountry(country);
  return {amount:currency.code === "JPY" || currency.code === "KRW" ? Math.round(baseUsd * currency.rate) : Math.round(baseUsd * currency.rate * 100) / 100, code:currency.code, baseUsd, local:false};
}

function formatCoursePriceValue(price){
  if(price.local) return `${price.amount.toLocaleString()} birr`;
  try{
    return new Intl.NumberFormat(undefined, {style:"currency", currency:price.code, maximumFractionDigits:price.amount < 10 ? 2 : 0}).format(price.amount);
  }catch(e){
    return `${price.code} ${price.amount}`;
  }
}

function formatCoursePrice(courseId, country){
  return formatCoursePriceValue(coursePrice(courseId, country));
}

// "was X, now Y" markup used at the top of every course card.
function formatCoursePriceDiscount(courseId, country){
  const original = formatCoursePriceValue(coursePriceOriginal(courseId, country));

  return `<span class="price-original">${original}</span> <span class="price-current">${current}</span>`;
}

    const business = normalizeCourseProgress(parsed.business);

}

function generateRequestId(prefix){
  let token = "";
  try{
    if(window.crypto && window.crypto.getRandomValues){
      const values = new Uint32Array(2);
      window.crypto.getRandomValues(values);
      token = Array.from(values).map(value => value.toString(36).toUpperCase().padStart(6,"0")).join("").slice(0,10);
    }
  }catch(e){ /* use the fallback below */ }
  if(!token) token = `${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(-10);
  return `${prefix}-${token}`;
}

function completedCount(){
  const p = activeProgress();
  return activeLessons().filter(l => isLessonFinalized(l.id, p)).length;
}

function lessonScore(lessonId, progress){
  const p = progress || activeProgress();
  const result = p.finalResults && p.finalResults[lessonId];
  if(isRecord(result) && Number.isFinite(Number(result.score))) return Number(result.score);
  const legacyScore = Number(p.lessonScores && p.lessonScores[lessonId]);
  return Number.isFinite(legacyScore) ? legacyScore : 0;
}

function isLessonFinalized(lessonId, progress){
  const p = progress || activeProgress();
  return !!(p.completed[lessonId] && p.quizLocked[lessonId] && p.finalResults && isRecord(p.finalResults[lessonId]) && Number.isFinite(Number(p.finalResults[lessonId].score)));
}

function totalScore(){
  const p = activeProgress();
  return activeLessons().reduce((sum,l) => sum + lessonScore(l.id, p), 0);
}
function totalPossible(){ return activeLessons().reduce((sum,l) => sum + l.quiz.length, 0); }

function courseIsComplete(){
  return activeLessons().every(lesson => isLessonFinalized(lesson.id));
}

function isUnlocked(lessonId){
  const lessons = activeLessons();
  const p = activeProgress();
  const idx = lessons.findIndex(l => l.id === lessonId);
  if(idx <= 0) return true;
  const prev = lessons[idx-1];
  return isLessonFinalized(prev.id, p);
}

function handleScreenshotChange(input){
  const file = input && input.files ? input.files[0] : null;
  if(!file){
    pendingScreenshotDataUrl = "";
    pendingScreenshotName = "";
    return;
  }
  if(!/^image\//.test(file.type)){
    pendingScreenshotDataUrl = "";
    pendingScreenshotName = "";
    state.paymentFormError = "Please attach an image file (a screenshot of your payment confirmation).";
    render();
    return;
  }
  if(file.size > MAX_SCREENSHOT_BYTES){
    pendingScreenshotDataUrl = "";
    pendingScreenshotName = "";
    state.paymentFormError = "That image is larger than 4MB. Please attach a smaller screenshot.";
    render();
    return;
  }
  const reader = new FileReader();
  reader.onload = function(){
    pendingScreenshotDataUrl = String(reader.result || "");
    pendingScreenshotName = file.name;
    state.paymentFormError = "";
    render();
  };
  reader.onerror = function(){
    pendingScreenshotDataUrl = "";
    pendingScreenshotName = "";
    state.paymentFormError = "That image could not be read. Please try attaching it again.";
    render();
  };
  reader.readAsDataURL(file);
}

function latestRequestFor(courseId){
  const matches = paymentRequests.filter(r => r.courseId === courseId);
  if(!matches.length) return null;
  return matches.reduce((latest, r) => new Date(r.submittedAt) > new Date(latest.submittedAt) ? r : latest);
}

function submitPaymentRequest(event){
  if(event) event.preventDefault();
  const validIds = ["core","leadership","communication","business","strategic","team"];
  const courseId = validIds.includes(state.paymentCourse) ? state.paymentCourse : "core";
  const name = String((document.getElementById("payerName")||{}).value || "").trim();
  const email = String((document.getElementById("payerEmail")||{}).value || "").trim();
  const method = String((document.getElementById("payerMethod")||{}).value || "").trim();
  const ref = String((document.getElementById("payerRef")||{}).value || "").trim();
  const payDate = String((document.getElementById("payerDate")||{}).value || "").trim();
  if(!name || !email || !method || !ref || !payDate){
    state.paymentFormError = "Please fill in your name, email, payment method, reference number, and payment date.";
    render();
    return;
  }
  if(!pendingScreenshotDataUrl){
    state.paymentFormError = "Please attach a screenshot of your payment confirmation.";
    render();
    return;
  }
  const country = selectedCountry();
  const region = String(country || "").trim().toLowerCase() === "ethiopia" ? "ethiopia" : "international";
  const course = activeCourseInfoFor(courseId);
  const request = {
    id: generateRequestId("PR"),
    studentName: name,
    studentEmail: email,
    courseId,
    courseTitle: course.title,
    region,
    amountLabel: formatCoursePrice(courseId, country),
    paymentMethod: method,
    transactionRef: ref,
    paymentDate: payDate,
    screenshotDataUrl: pendingScreenshotDataUrl,
    screenshotName: pendingScreenshotName,
    submittedAt: new Date().toISOString(),
    status: "PENDING",
    decidedAt: null,
    decidedBy: null,
    rejectionReason: ""
  };
  paymentRequests.push(request);
  savePaymentRequests();
  pendingScreenshotDataUrl = "";
  pendingScreenshotName = "";
  state.paymentFormError = "";
  state.paymentFormSubmittedId = request.id;
  sendAutomaticEmail("submitted", request);
  render();
}

function logAudit(action, request){
  auditLog.push({
    id: generateRequestId("AUD"),
    action,
    at: new Date().toISOString(),
    admin: adminSession.name || "Unknown admin",
    requestId: request.id,
    courseId: request.courseId,
    courseTitle: request.courseTitle,

  });
