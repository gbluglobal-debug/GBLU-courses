<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GBLU — Mastery: The Core Five</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<!-- EmailJS: lets this static, no-backend page send real emails from the
     visitor's browser via a third-party API (no server of ours involved).
     See the EMAIL_CONFIG block near the top of the <script> for setup. -->
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<style>
  :root{
    --ink:#1E2A38;
    --ink-deep:#151E29;
    --surface:#26364A;
    --surface-raised:#2E4059;
    --paper:#F3F0E7;
    --text:#EDEFF2;
    --text-dim:#A9B4C2;
    --brass:#C99A4B;
    --brass-dim:#8C6C36;
    --teal:#4FA88F;
    --line:#3A4C63;
    --serif: 'Fraunces', Georgia, serif;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--ink); color:var(--text); font-family:var(--sans); line-height:1.6; min-height:100vh;}
  .app{max-width:960px; margin:0 auto; padding:0 24px;}
  a{color:inherit;} button{font-family:var(--sans); cursor:pointer; border:none;}
  button:focus-visible, a:focus-visible, input:focus-visible{outline:2px solid var(--teal); outline-offset:3px;}
  img{max-width:100%;} h1,h2,h3,p,li,button{overflow-wrap:anywhere;}
  .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;}

  /* ---------- MASTHEAD / NAV ---------- */
  .masthead{padding:22px 0 0; border-bottom:1px solid var(--line); margin-bottom:8px;}
  .masthead-top{display:flex; align-items:center; justify-content:space-between; padding-bottom:20px; gap:16px;}
  .brand-row{display:flex; align-items:center; gap:16px;}
  .gblu-logo{flex:0 0 auto; display:flex; line-height:0;}
  .gblu-word{font-family:var(--serif); font-weight:700; font-size:2.8rem; letter-spacing:1px; color:var(--brass); line-height:1;}
  .gblu-tag{font-size:0.82rem; color:var(--text-dim); letter-spacing:0.5px; margin-top:5px;}
  .nav-links{display:flex; align-items:center; gap:22px; font-size:0.92rem; color:var(--text-dim);}
  .nav-links button{background:none; color:var(--text-dim); font-size:0.92rem; padding:4px 0;}
  .nav-links button.active{color:var(--brass);}
  .nav-site-link{display:flex; align-items:center; gap:8px; padding-left:14px; border-left:1px solid var(--line); text-decoration:none;}
  .nav-site-qr{width:30px; height:30px; background:#fff; padding:3px; border-radius:2px; display:block;}
  .nav-site-label{font-size:0.78rem; color:var(--text-dim); line-height:1.3;}
  .nav-site-link:hover .nav-site-label{color:var(--brass);}

  /* ---------- HOME / HERO ---------- */
  .hero{padding:56px 0 40px;}
  .hero h1{font-family:var(--serif); font-weight:600; font-size:clamp(2.1rem, 5vw, 3.1rem); line-height:1.12; max-width:13ch; margin-bottom:22px;}
  .hero p{max-width:56ch; color:var(--text-dim); font-size:1.05rem; margin-bottom:30px;}
  .cta-row{display:flex; gap:14px; align-items:center; flex-wrap:wrap;}
  .btn-primary{background:var(--brass); color:var(--ink-deep); font-weight:600; padding:13px 26px; border-radius:2px; font-size:0.95rem; transition:background 0.15s;}
  .btn-primary:hover{background:#dcae5f;}
  .btn-primary:disabled{background:var(--line); color:var(--text-dim); cursor:not-allowed;}
  .btn-ghost{background:none; color:var(--text-dim); padding:13px 6px; font-size:0.95rem; border-bottom:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text); border-color:var(--text-dim);}
  .hero-meta{display:flex; gap:36px; margin-top:48px; padding-top:26px; border-top:1px solid var(--line); flex-wrap:wrap;}
  .hero-meta div{min-width:110px;}
  .hero-meta .num{font-family:var(--serif); font-size:1.5rem; color:var(--brass);}
  .hero-meta .label{font-size:0.83rem; color:var(--text-dim); margin-top:2px;}

  /* ---------- DASHBOARD ---------- */
  .dash-courses{padding:8px 0 60px;}
  .dash-heading{font-family:var(--serif); font-size:1.3rem; font-weight:600; margin-bottom:20px; color:var(--text);}
  .course-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:18px;}
  .course-card{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:22px; cursor:pointer; transition:border-color 0.15s;}
  .course-card:hover{border-color:var(--brass);}
  .course-card.locked{cursor:default; opacity:0.62;}
  .course-card.locked:hover{border-color:var(--line);}
  .course-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px;}
  .course-card-title{font-family:var(--serif); font-size:1.15rem; font-weight:600; color:var(--text);}
  .course-card-badge{font-size:0.72rem; letter-spacing:0.3px; color:var(--text-dim); border:1px solid var(--line); padding:3px 9px; border-radius:20px; white-space:nowrap;}
  .course-card-badge.active{color:var(--teal); border-color:var(--teal);}
  .course-card-desc{color:var(--text-dim); font-size:0.9rem; margin-bottom:6px;}
  .course-card-meta{font-size:0.8rem; color:var(--text-dim); margin-bottom:16px;}
  .course-card-btn{width:100%; text-align:center; margin-top:6px;}

  /* ---------- COURSE VIEW ---------- */
  .course-head{padding:40px 0 8px;}
  .course-head h2{font-family:var(--serif); font-size:1.8rem; font-weight:600;}
  .course-head p{color:var(--text-dim); margin-top:8px; max-width:62ch;}
  .pass-note{display:inline-block; margin-top:18px; padding:10px 14px; border-left:3px solid var(--brass); background:var(--surface-raised); color:var(--brass); font-size:0.86rem; font-weight:600;}
  .enrollment-note{margin-top:12px; padding:12px 14px; border-left:3px solid var(--teal); background:var(--surface-raised); color:var(--text-dim); font-size:0.86rem; line-height:1.5;}
  .enrollment-note strong{color:var(--text);}
  .payment-panel{max-width:64ch; padding-bottom:70px;}
  .payment-disclaimer{background:var(--surface-raised); border-left:3px solid var(--brass); padding:14px 16px; font-size:0.88rem; color:var(--text-dim); line-height:1.55; margin-bottom:24px;}
  .payment-methods{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; margin-bottom:28px;}
  .payment-method{background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:16px 18px;}
  .payment-method-name{font-family:var(--serif); font-size:1.05rem; font-weight:600; color:var(--brass); margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .payment-method-account{font-size:1.05rem; letter-spacing:0.3px; color:var(--text); margin-bottom:4px;}
  .payment-method-holder{font-size:0.85rem; color:var(--text-dim);}
  .copy-btn{background:var(--surface-raised); border:1px solid var(--line); color:var(--text-dim); font-size:0.72rem; letter-spacing:0.3px; padding:3px 9px; border-radius:20px; white-space:nowrap; transition:border-color 0.15s, color 0.15s;}
  .copy-btn:hover{border-color:var(--brass); color:var(--brass);}
  .copy-btn.copied{border-color:var(--teal); color:var(--teal);}
  .unlock-form{display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; padding-top:6px; border-top:1px solid var(--line);}
  .unlock-form label{flex:1 1 100%; font-size:0.86rem; color:var(--text-dim); margin-bottom:6px;}
  .unlock-form input{flex:1 1 220px; background:var(--surface); border:1px solid var(--line); color:var(--text); padding:11px 14px; border-radius:2px; font-size:0.95rem;}
  .unlock-form input:focus-visible{outline:2px solid var(--teal); outline-offset:2px;}
  .payment-error{color:#D98888; font-size:0.86rem; margin-top:12px;}
  .payment-request-form select{background:var(--surface); border:1px solid var(--line); color:var(--text); padding:11px 14px; border-radius:2px; font-size:0.95rem; flex:1 1 220px;}
  .payment-request-form input[type="file"]{flex:1 1 220px; background:var(--surface); border:1px solid var(--line); color:var(--text-dim); padding:9px 12px; border-radius:2px; font-size:0.88rem;}
  .screenshot-attached{flex:1 1 100%; color:var(--teal); font-size:0.86rem;}
  .request-status-note{padding:12px 14px; border-left:3px solid var(--teal); background:var(--surface-raised); font-size:0.88rem; color:var(--text-dim); margin-bottom:24px; line-height:1.5;}
  .request-status-note.status-rejected{border-color:#B85C5C;}
  .request-status-note strong{color:var(--text);}
  .access-code-details{margin:26px 0 6px; border-top:1px solid var(--line); padding-top:16px;}
  .access-code-details summary{cursor:pointer; color:var(--text-dim); font-size:0.9rem; margin-bottom:10px;}
  .access-code-details summary:hover{color:var(--brass);}
  .request-card{background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--line); border-radius:4px; padding:20px 22px; margin-bottom:16px;}
  .request-card.status-pending{border-left-color:var(--brass);}
  .request-card.status-approved{border-left-color:var(--teal);}
  .request-card.status-rejected{border-left-color:#B85C5C;}
  .request-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:14px;}
  .request-title{font-family:var(--serif); font-size:1.08rem; font-weight:600;}
  .request-status-badge{font-size:0.72rem; letter-spacing:0.4px; padding:4px 10px; border-radius:20px; border:1px solid var(--line); white-space:nowrap; height:fit-content;}
  .request-status-badge.status-pending{color:var(--brass); border-color:var(--brass);}
  .request-status-badge.status-approved{color:var(--teal); border-color:var(--teal);}
  .request-status-badge.status-rejected{color:#D98888; border-color:#B85C5C;}
  .request-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:10px 18px; font-size:0.9rem; color:var(--text); margin-bottom:14px;}
  .request-label{display:block; font-size:0.74rem; letter-spacing:0.3px; text-transform:uppercase; color:var(--text-dim); margin-bottom:2px;}
  .request-screenshot{margin-bottom:14px;}
  .request-screenshot img{max-width:280px; max-height:280px; border:1px solid var(--line); border-radius:4px; margin-top:6px; display:block;}
  .request-reason{font-size:0.86rem; color:#D98888; margin-bottom:12px;}
  .request-actions{display:flex; gap:12px; flex-wrap:wrap;}
  .btn-reject{background:none; border:1px solid #B85C5C; color:#D98888; padding:13px 20px; border-radius:2px; font-size:0.95rem; font-weight:600;}
  .btn-reject:hover{background:rgba(184,92,92,0.12);}
  .audit-list{list-style:none;}
  .audit-item{padding:10px 0; border-top:1px solid var(--line); font-size:0.87rem; color:var(--text-dim);}
  .audit-item:last-child{border-bottom:1px solid var(--line);}
  .progress-track{height:6px; background:var(--surface); border-radius:3px; margin:24px 0 36px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--brass); transition:width 0.4s ease;}
  .waypoints{list-style:none; padding-bottom:60px;}
  .waypoint{display:flex; gap:18px; padding:20px 0; border-top:1px solid var(--line); align-items:flex-start;}
  .waypoint:last-child{border-bottom:1px solid var(--line);}
  .waypoint-section{padding:24px 0 8px; color:var(--brass); font-size:0.74rem; letter-spacing:0.14em; text-transform:uppercase; font-weight:700;}
  .wp-marker{flex:0 0 auto; width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line); display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-size:0.9rem; color:var(--text-dim); margin-top:2px;}
  .wp-marker.done{background:var(--brass); border-color:var(--brass); color:var(--ink-deep); font-weight:700;}
  .wp-marker.locked{opacity:0.5;}
  .wp-body{flex:1;}
  .wp-title{font-family:var(--serif); font-size:1.12rem; font-weight:600; margin-bottom:4px;}
  .wp-desc{color:var(--text-dim); font-size:0.92rem; max-width:56ch;}
  .wp-status{font-size:0.8rem; color:var(--teal); margin-top:8px;}
  .wp-locked-msg{font-size:0.8rem; color:var(--brass-dim); margin-top:8px;}
  .wp-action{flex:0 0 auto; background:none; border:1px solid var(--line); color:var(--text); padding:9px 16px; font-size:0.86rem; border-radius:2px; white-space:nowrap;}
  .wp-action:hover{border-color:var(--brass); color:var(--brass);}
  .wp-action:disabled{opacity:0.4; cursor:not-allowed;}

  /* ---------- LESSON VIEW ---------- */
  .lesson{padding:40px 0 70px; max-width:66ch;}
  .lesson .kicker{color:var(--teal); font-size:0.83rem; margin-bottom:10px;}
  .lesson h2{font-family:var(--serif); font-size:1.9rem; font-weight:600; margin-bottom:22px; line-height:1.2;}
  .lesson p{margin-bottom:16px; color:#DDE2E8; font-size:1.01rem;}
  .lesson .lesson-h3{font-family:var(--serif); font-size:1.22rem; font-weight:600; color:var(--brass); margin:34px 0 14px;}
  .lesson .lesson-h3:first-child{margin-top:0;}
  .example-box{background:var(--surface); border-left:3px solid var(--teal); padding:16px 20px; margin:20px 0; border-radius:0 2px 2px 0;}
  .example-box .ex-label{font-size:0.78rem; color:var(--teal); letter-spacing:0.3px; margin-bottom:6px;}
  .example-box p{margin-bottom:0; color:#DDE2E8; font-size:0.97rem;}
  .takeaways{background:var(--surface-raised); padding:18px 22px; border-radius:2px; margin:24px 0;}
  .takeaways .tk-label{font-family:var(--serif); font-size:1rem; margin-bottom:10px; color:var(--brass);}
  .takeaways ul{padding-left:18px; color:#DDE2E8; font-size:0.95rem;}
  .takeaways li{margin-bottom:6px;}
  .lesson .divider{height:1px; background:var(--line); margin:34px 0;}
  .quiz-progress{font-size:0.83rem; color:var(--text-dim); margin-bottom:20px;}
  .quiz-q{margin-bottom:26px;}
  .quiz-q .qtext{font-weight:500; margin-bottom:12px;}
  .quiz-opt{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); color:var(--text); padding:12px 16px; border-radius:2px; margin-bottom:8px; font-size:0.93rem;}
  .quiz-opt:hover{border-color:var(--text-dim);}
  .quiz-opt.selected{border-color:var(--teal); background:var(--surface-raised);}
  .quiz-opt.correct{border-color:var(--teal); background:rgba(79,168,143,0.15);}
  .quiz-opt.wrong{border-color:#B85C5C; background:rgba(184,92,92,0.12);}
  .quiz-opt.locked-opt{cursor:default;}
  .quiz-opt:disabled{opacity:1;}
  .quiz-explanation{margin:10px 0 0; padding:10px 13px; border-left:2px solid var(--brass); background:var(--surface-raised); color:var(--text-dim); font-size:0.86rem; line-height:1.5;}
  .clear-btn{background:none; border:none; color:var(--text-dim); font-size:0.82rem; padding:2px 0 0; text-decoration:underline; text-underline-offset:2px;}
  .clear-btn:hover{color:var(--brass);}
  .lesson-nav{display:flex; justify-content:space-between; align-items:center; margin-top:30px; flex-wrap:wrap; gap:12px;}
  .feedback{font-size:0.88rem; margin-top:6px; color:var(--text-dim);}
  .score-banner{background:var(--surface); padding:14px 18px; border-radius:2px; margin-bottom:22px; font-size:0.93rem;}

  /* ---------- CERTIFICATE ---------- */
  .cert-wrap{padding:46px 0 80px;}
  .cert-intro{text-align:center; margin-bottom:34px;}
  .cert-intro h2{font-family:var(--serif); font-size:1.8rem; margin-bottom:10px;}
  .cert-intro p{color:var(--text-dim);}
  .verification-panel{max-width:620px; margin:0 auto 28px; padding:22px; background:var(--surface); border:1px solid var(--line); border-radius:4px;}
  .verification-form{display:flex; gap:10px; align-items:stretch; flex-wrap:wrap; margin-top:16px;}
  .verification-form input{flex:1 1 260px; min-width:0; background:var(--ink); border:1px solid var(--line); color:var(--text); padding:12px 16px; border-radius:2px; font-size:0.95rem; font-family:var(--sans);}
  .verification-result{margin-top:18px; padding:14px 16px; border-left:3px solid var(--teal); background:var(--surface-raised); color:var(--text); font-size:0.9rem;}
  .verification-result.invalid{border-left-color:#B85C5C;}
  .reset-panel{text-align:center; margin:12px 0 70px; padding-top:22px; border-top:1px solid var(--line);}
  .reset-button{background:none; color:#D49A9A; border:1px solid #754D58; padding:9px 16px; border-radius:2px; font-size:0.84rem;}
  .reset-button:hover{border-color:#D49A9A; color:#F1C1C1;}
  .onboarding{max-width:720px; margin:0 auto; padding:64px 0 90px;}
  .onboarding-kicker{color:var(--teal); font-size:0.78rem; letter-spacing:0.14em; text-transform:uppercase; margin-bottom:12px;}
  .onboarding h1{font-family:var(--serif); font-size:2.35rem; font-weight:600; line-height:1.12; margin-bottom:14px;}
  .onboarding-intro{color:var(--text-dim); max-width:58ch; margin-bottom:28px; font-size:1rem;}
  .profile-form{background:var(--surface); border:1px solid var(--line); padding:28px; border-radius:3px;}
  .profile-form-grid{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
  .profile-field{display:flex; flex-direction:column; gap:7px;}
  .profile-field.full{grid-column:1 / -1;}
  .profile-field label{font-size:0.82rem; color:var(--brass);}
  .profile-field input,.profile-field select,.profile-field textarea{font:inherit; background:var(--surface-raised); color:var(--text); border:1px solid var(--line); padding:11px 12px; border-radius:2px; width:100%;}
  .profile-field textarea{min-height:100px; resize:vertical;}
  .profile-field input:focus,.profile-field select:focus,.profile-field textarea:focus{outline:1px solid var(--teal); border-color:var(--teal);}
  .profile-form-actions{display:flex; justify-content:flex-end; margin-top:24px;}
  .profile-card{background:var(--surface); border:1px solid var(--line); padding:22px 24px; margin:24px 0 38px; border-radius:3px;}
  .profile-card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:16px;}
  .profile-card h2{font-family:var(--serif); font-size:1.35rem; font-weight:600;}
  .profile-card-subtitle{color:var(--text-dim); font-size:0.85rem; margin-top:4px;}
  .profile-edit{background:none; color:var(--brass); border:1px solid var(--line); padding:8px 13px; border-radius:2px; font-size:0.82rem; white-space:nowrap;}
  .profile-edit:hover{border-color:var(--brass);}
  .profile-details{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px 28px;}
  .profile-detail-label{color:var(--text-dim); font-size:0.74rem; text-transform:uppercase; letter-spacing:0.08em; margin-bottom:3px;}
  .profile-detail-value{color:var(--text); font-size:0.94rem; overflow-wrap:anywhere;}
  .profile-bio{grid-column:1 / -1; padding-top:6px;}
  .profile-empty{color:var(--text-dim); font-size:0.9rem;}
  .course-card-price{color:var(--brass); font-size:0.9rem; font-weight:600; margin-top:14px;}
  .price-original{color:var(--text-dim); text-decoration:line-through; font-weight:400; margin-right:6px;}
  .price-current{color:var(--brass); font-weight:700;}
  .name-input{display:flex; gap:10px; justify-content:center; margin:26px 0 14px; flex-wrap:wrap;}
  .name-input input{background:var(--surface); border:1px solid var(--line); color:var(--text); padding:12px 16px; border-radius:2px; font-size:0.95rem; width:280px; font-family:var(--sans);}
  .lock-warning{text-align:center; font-size:0.83rem; color:var(--brass-dim); margin-bottom:30px; max-width:48ch; margin-left:auto; margin-right:auto;}

  /* Certificate — ornamental frame */
  .cert-outer{
    --cert-frame-1:#a9822f; --cert-frame-2:#e9cd8c; --cert-frame-3:#ceac5e; --cert-frame-4:#8a6a2c; --cert-frame-5:#c9a552;
    --cert-primary:#8a6a2c; --cert-secondary:#b8ac82; --cert-light:#d8cea4; --cert-mid:#c9a552; --cert-name-mid:#d9b767;
    --cert-border:#cfc9b8; --cert-muted:#8b8265; --cert-muted-strong:#6b6350;
    --cert-glow:rgba(201,154,75,0.10); --cert-glow-alt:rgba(79,168,143,0.07);
    width:100%; max-width:760px; margin:0 auto; padding:14px; background:linear-gradient(135deg,var(--cert-frame-1) 0%,var(--cert-frame-2) 18%,var(--cert-frame-3) 32%,var(--cert-frame-4) 50%,var(--cert-frame-2) 68%,var(--cert-frame-1) 82%,var(--cert-frame-5) 100%); border-radius:3px; box-shadow:0 30px 70px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.15);
  }
  .cert-outer.cert-theme-strategic{
    --cert-frame-1:#214c73; --cert-frame-2:#a8d0ec; --cert-frame-3:#5d91b9; --cert-frame-4:#173b5a; --cert-frame-5:#78afd2;
    --cert-primary:#24577f; --cert-secondary:#6f9fc1; --cert-light:#c7e1f2; --cert-mid:#4386b2; --cert-name-mid:#8fc4e3;

/* ============================================================================
   GBLU ACADEMY — DEVELOPMENT NOTES (Part 1 preparation, added without changing
   any behavior). See the accompanying technical report for full detail.

   CURRENT ARCHITECTURE
   - Single static HTML file. No framework, no bundler, no backend, no build step.
   - Vanilla JS "state object + render() to innerHTML" pattern (see `state`,
     `render()`, and the `goTo`/`openCourse`/etc. action functions below).
   - All course/lesson/quiz content is hardcoded in JS arrays/objects
     (LESSONS, COMMUNICATION_LESSONS, BUSINESS_LESSONS, STRATEGIC_LESSONS,
     TEAM_LESSONS, CORE_FIVE_LESSONS). This content must be preserved as-is
     when migrating to a database — do not rewrite lesson/quiz text.
   - Persistence is 100% browser localStorage (STORAGE_KEY below), read/written
     via getStorage()/readStoredProgress()/saveProgress(). There is no server,
     no user accounts, and no cross-device sync.
   - "Applicant registration" (createApplicantProfile/normalizeApplicantProfile/
     submitApplicantProfile) collects name/email/role/organization/country/bio,
     but only stores it in localStorage — nothing is transmitted anywhere.
   - Pricing (coursePrice/formatCoursePrice/COUNTRY_CURRENCIES/CURRENCY_RATES)
     is a hardcoded, frontend-only price *display* calculator. Ethiopia is
     special-cased to flat ETB amounts (600/200 birr); all other countries get
     an illustrative USD-based conversion with static exchange rates. There is
     NO payment collection anywhere in this file — "Enrollment fee" is display
     text only, not a checkout flow.
   - Certificate generation (generateCertificate/certificateId) is entirely
     client-side: an ID is created with crypto.getRandomValues (or a Date.now
     fallback) and saved to localStorage alongside the learner's typed name,
     date, and score. There is no signing, no server record, and nothing
     prevents a user from editing localStorage directly to fabricate a result.
   - Certificate "verification" (verifyCertificate/renderVerification) only
     checks the *current browser's own* localStorage for a matching ID. It
     cannot verify a certificate generated on a different device/browser, and
     is explicitly labeled as frontend-only in the UI copy.
   - Lesson unlocking (isUnlocked) and quiz locking (quizLocked/finalResults)
     are enforced only in JS running in the user's own browser — trivially
     bypassable via devtools. There is no real access control.
   - Course access (isCourseUnlocked/openPayment/submitUnlockCode) is gated
     behind a manual-payment flow: every course starts locked, clicking it
     shows a payment page listing Telebirr / M-Pesa / CBE details (manual
     verification only — this site has NO integration with any of the three
     and CANNOT detect or confirm a transaction automatically). After paying,
     the learner must be manually verified by the site owner and given an
     access code from ACCESS_CODES to type in; only then does the course
     unlock. Like everything else here, this is a client-side, devtools-
     bypassable gate, not real payment security.
   - Payment Requests / Admin Dashboard (paymentRequests/PAYMENTS_STORAGE_KEY,
     auditLog/AUDIT_STORAGE_KEY, adminSession/ADMIN_PASSCODE) are a SECOND,
     fuller way to run the same manual-verification idea: a learner fills in
     a form (name/email/method/reference/date/screenshot) instead of waiting
     for a code, which is stored as a PENDING request in this browser's
     localStorage (screenshots included, as base64 — capped at 4MB each).
     An admin who knows ADMIN_PASSCODE can open the dashboard, see requests,
     and click Approve/Reject. IMPORTANT LIMITS, by design of a single static
     HTML file with no server:
       * The dashboard can only ever see requests submitted IN THE SAME
         BROWSER. A student submitting from their own phone will not appear
         on an admin's laptop. Making that work needs a real backend + a
         shared database (e.g. Firebase/Supabase/Postgres) that both sides
         talk to over the network.
       * Automatic student notifications (Payment Submitted / Approved /
         Rejected) are sent via EmailJS (see EMAIL_CONFIG near the top of
         this script), a third-party service that can send real email
         straight from the visitor's browser with no server of ours. This
         file ships with placeholder EmailJS IDs, so sends will silently
         no-op (logged to the console) until the site owner creates a free
         EmailJS account, an email template, and fills in serviceId /
         templateIds / publicKey. The manual "Open email to student" mailto:
         link is kept as a fallback the admin can use regardless of whether
         EmailJS is configured. Emails are notification-only: they never
         grant or revoke course access by themselves. Approval/rejection
         only ever happens via approvePaymentRequest/rejectPaymentRequest,
         triggered from the Admin Dashboard by a logged-in admin — an email
         failing or bouncing has no effect on that decision.
       * ADMIN_PASSCODE ships in this file's JS and is trivially visible via
         view-source/devtools. It deters casual clicking, not a real attacker.
         Treat it the way you'd treat an unlocked door with a sign on it, and
         do not store anything here you wouldn't want a curious visitor to

   (flagged here for the migration plan — NOT implemented in this phase):
     1. localStorage persistence -> real accounts + database (see saveProgress/

        certificates with a public verification endpoint.
     6. Client-only lesson/quiz locking -> server-enforced progress and
        one-time quiz submission.
   ============================================================================ */

// Every browser that redeems a code gets a random id saved to localStorage the
// first time it's needed. This is what "binds" a code to one device.
function getDeviceId(){
  let id = "";
  try{ id = localStorage.getItem("gblu-device-id") || ""; }catch(e){}
  if(!id){
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (String(Date.now()) + "-" + Math.random().toString(16).slice(2));
    try{ localStorage.setItem("gblu-device-id", id); }catch(e){}

  return id;
}

const LESSONS = [
{
  id:"l1", title:"What Leadership Actually Means", desc:"Separating leadership from authority, titles, and charisma.",
  reading:[
    "Most people learn about leadership backwards. They picture a person with a title, a corner office, or a commanding voice, and assume that is what leadership looks like. But a title gives you authority, the right to be obeyed. It does not give you leadership, the ability to be followed by choice.",
    "Leadership is the practice of moving a group of people toward something worthwhile, in a way that leaves them more capable and more willing the next time. You can hold authority without leading, and you can lead without holding any authority at all.",
    "## Why the Distinction Matters",
    "This is not a semantic distinction. It has real, practical consequences for how a group performs. Authority can move people, but it moves them at the speed and quality of compliance: people do exactly what is asked, and not much more. Leadership moves people at the speed and quality of commitment: people bring judgment, initiative, and effort that was never explicitly requested, because they have decided the goal is worth it.",
    "You can usually tell the difference by watching what happens when the person with authority leaves the room. If the work continues at the same pace, with the same care, leadership was present. If everything slows down or quality drops the moment supervision disappears, what was present was authority alone. Neither is a moral failing on the group's part; it is simply a signal about what kind of relationship has actually been built.",
    "## Leadership Without a Title",
    "Because leadership is a practice rather than a position, it shows up constantly in places an org chart would never capture: the newest hire who asks the question everyone else was afraid to ask, the quiet teammate who reorganizes a shared document so the whole group can find things faster, the person who calms a tense meeting by naming what everyone is feeling but not saying. None of these people needed permission. They saw something that would help the group and did it.",
    "This matters for two reasons. First, it means you do not have to wait for a promotion to start practicing leadership; the skills in this course are usable today, in your current role, regardless of what it says on your badge. Second, it means that people in formal authority should be looking for these moments in others and reinforcing them, because a team full of people who lead in small ways is far more capable than a team that waits to be told what to do.",
    "## Common Misconceptions",
    "A few myths make this harder to see clearly. The first is that leadership requires charisma, a magnetic personality that draws people in. Charisma can help someone get an initial hearing, but it says nothing about whether the group actually gets to somewhere better, and plenty of quiet, unremarkable people lead extremely well. The second myth is that leadership means always having the answer. In practice, some of the most trusted leaders are the ones most willing to say 'I don't know, let's figure it out,' because that honesty is itself a form of moving the group forward.",
    "The third myth, and probably the most damaging one, is that leadership is reserved for people with seniority or formal power. This one is worth challenging directly: it lets people off the hook. If leadership is something only the person at the top does, then everyone else is free to wait passively for direction. If leadership is a practice anyone can pick up in a given moment, everyone shares some responsibility for the outcome.",
    "## Building the Habit",
    "Like any skill, leadership improves with deliberate repetition, not with a single dramatic moment. A useful starting habit is to notice, once a day, one small opportunity to move something forward without being asked: clarifying a confusing plan, checking in on someone who seems stuck, or simply naming a problem out loud instead of quietly hoping someone else raises it. None of these require authority. All of them build the muscle this course is about."

    {title:"Example: Authority without leadership", text:"A newly promoted manager starts assigning tasks on day one without asking anyone how the team currently works. People comply because they have to, but morale quietly drops and good ideas stop surfacing. He has authority. He has not yet earned leadership."}

{
  id:"l2", title:"Self-Leadership: Lead Yourself First", desc:"Self-awareness and integrity as one essential lesson in the wider Leadership Path.",
  reading:[
    "Before anyone trusts you to lead them, they watch how you lead yourself. Do you do what you said you would do? Do you stay steady when things go wrong? People read these signals constantly, often before they consciously decide whether to trust you.",
    "Self-awareness means knowing your default reactions under pressure, and knowing the gap between how you intend to come across and how you actually land with others. Integrity, in this context, is not a lofty virtue, it is consistency: the version of you in a crisis is recognizably the same as the version of you on an easy day.",
    "## Where Leadership Failures Really Start",
    "If you trace most leadership failures back to their root, they rarely start with a bad strategic call. They start with a leader noticing their own impact on other people too late: the sharp tone that discouraged someone from speaking up again, the broken small promise that quietly taught a team not to rely on their word, the defensiveness that made feedback feel dangerous to offer. By the time the damage shows up as a resignation or a missed deadline, the actual cause happened weeks or months earlier, in a moment the leader never noticed.",
    "This is why self-leadership comes first in this course, before any of the more visible skills like communication or delegation. Every other leadership skill is filtered through it. A brilliant communicator who lacks self-awareness will communicate their blind spots just as clearly as their strengths.",
    "## Practicing Self-Awareness",
    "Self-awareness is not a personality trait some people have and others lack; it is a practice you can build. Three habits tend to work well. First, after any tense moment, ask yourself a simple question: what did I just do, and is that the version of me I want people to experience? Second, actively seek small, low-stakes feedback before you need big, high-stakes feedback, so you are not hearing about a blind spot for the first time during a crisis. Third, notice your own patterns under specific kinds of pressure, tight deadlines, public criticism, ambiguity, since most people have one or two default reactions that repeat across very different situations.",
    "None of this requires perfect self-knowledge. It requires enough honesty to notice a pattern once it has happened a few times, and enough humility to believe other people's descriptions of your impact even when they don't match your intentions.",
    "## Integrity Under Pressure",
    "Integrity gets tested exactly when it's inconvenient, which is precisely why it matters. Anyone can keep a promise when keeping it is easy. The real signal is what happens when keeping it costs something: time, comfort, or a difficult conversation. A leader who quietly lets a commitment slide when it becomes inconvenient teaches their team, without ever saying so directly, that commitments are conditional. A leader who works to honor the spirit of a promise even when the letter of it becomes impossible, the way the store manager in the example below still gathered his team to explain a schedule change, teaches the opposite lesson.",
    "## What This Builds Over Time",
    "None of this pays off immediately. Self-awareness and integrity are compounding: each consistent moment adds a small amount of trust, and each inconsistent one withdraws a disproportionately larger amount. Teams tend to remember the exceptions far more vividly than the routine, which is exactly why the routine matters so much."
  ],
  examples:[
    {title:"Example: Noticing your own pattern", text:"A team lead realizes that whenever a project falls behind, she starts micromanaging every task, which makes her team more anxious and slower, not faster. Naming this pattern to herself is the first step to catching it in the moment and choosing a calmer response instead."},
    {title:"Example: Consistency under pressure", text:"A store manager promises staff he will always tell them about schedule changes a week in advance. One week, a last-minute change is unavoidable. Instead of quietly changing the schedule, he calls a quick huddle, explains why, and apologizes for the short notice. The promise stayed intact even when circumstances did not cooperate."}

  takeaways:["People watch how you lead yourself before trusting you to lead them.","Self-awareness starts with noticing your default reactions under pressure.","Integrity means consistency, not perfection.","Naming your own patterns is the first step to changing them."],

{
  id:"l3", title:"Emotional Intelligence in Leadership", desc:"Reading your own emotions and other people's, and using that information well.",
  reading:[
    "Emotional intelligence is the ability to notice emotions, in yourself and others, and use that information to guide your behavior rather than being run by it. A leader with low emotional intelligence might snap at a team during a stressful deadline, then wonder why people stopped raising problems early.",
    "This is not about suppressing emotion. It is about widening the gap between feeling something and acting on it, long enough to choose a response that actually serves the situation instead of just venting the feeling.",
    "## The Skill Underneath the Skill",
    "Emotional intelligence is sometimes treated as a soft, secondary skill compared to strategy or technical expertise. In practice, it is closer to a multiplier on every other skill a leader has. A technically brilliant plan delivered in a way that makes people defensive rarely survives contact with a real team. A mediocre plan delivered with genuine attentiveness to how people are receiving it often gets improved collaboratively into a much better one. The emotional layer of leadership is not decoration on top of the real work; it largely determines whether the real work gets done well.",
    "## Reading Yourself First",
    "Emotional intelligence starts internally, with the ability to notice what you are feeling while you are feeling it, not just afterward in hindsight. This sounds simple and is genuinely difficult, especially under pressure, when physical stress responses arrive before conscious awareness does. A racing heart, a tight jaw, or the urge to interrupt someone are all data. Leaders who train themselves to notice these signals early get a head start on choosing their response, rather than being carried along by it.",
    "## Reading the Room",
    "The second half of emotional intelligence is external: noticing shifts in other people, a normally engaged teammate going quiet, a usually calm colleague becoming short in messages, tension in a meeting that no one has named out loud. These signals are rarely announced directly. Most people do not walk into work and state their emotional state plainly; they show it through changes in behavior. Leaders who pay attention to these changes, and check in on them with curiosity rather than judgment, often catch real problems while they are still small and easy to address.",
    "## Widening the Gap",
    "The core practical skill this lesson teaches is not emotional suppression, it is delay. Between any stimulus and any response there is a gap, however brief, and that gap is where choice lives. Strong emotional reactions try to close that gap as fast as possible, pushing you toward an immediate reply, a defensive comment, or a snap decision. Deliberately widening that gap, even by a few minutes, even just by taking a breath before responding, is often the entire difference between a reaction you regret and a response that actually helps.",
    "## Why This Compounds for Leaders Specifically", 
    "A leader's emotional state is disproportionately visible and disproportionately contagious. A single sharp comment from a peer might be forgotten by lunchtime; the same comment from someone in a position of authority can be replayed and reinterpreted by a team for weeks. This is not fair, but it is consistent, and it is exactly why leaders benefit from developing this skill more deliberately than most other people do."
  ],
  examples:[
    {title:"Example: The pause before reacting", text:"A director receives an email that feels like a personal attack from a peer. Her first instinct is to fire back immediately. Instead, she closes the laptop, takes a walk, and drafts a reply an hour later that addresses the actual issue instead of the emotional sting. The relationship survives, and the real problem gets solved."},
    {title:"Example: Reading the room", text:"A team lead notices that a normally talkative engineer has gone quiet in meetings for two weeks. Rather than assuming disengagement, he asks a private, low-pressure question: 'You've seemed a bit quiet lately, everything okay?' It turns out the engineer is dealing with a family issue and appreciates being noticed rather than judged."}
  ],
  takeaways:["Emotional intelligence means noticing emotions, not suppressing them.","There is a gap between feeling something and acting on it; leaders learn to widen that gap.","Reacting immediately under strong emotion rarely produces your best response.","Noticing changes in others' behavior is a form of leadership attentiveness."],
  quiz:[
    {q:"How does the lesson define emotional intelligence?", options:["Never feeling negative emotions","Noticing emotions in yourself and others and using that to guide behavior","Being the most talkative person in the room","Avoiding emotional topics at work"], correct:1},
    {q:"What happens to a team, per the lesson, when a leader snaps under stress?", options:["The team becomes more open about problems","People tend to stop raising problems early","Nothing changes","The team becomes more productive"], correct:1},
    {q:"What is the lesson's core distinction between feeling and acting?", options:["They are the same thing","There is a gap between them, and leaders learn to widen that gap before responding","Feelings should always be suppressed entirely","Acting on feelings immediately is usually best"], correct:1},
    {q:"In the 'pause before reacting' example, what did the director do instead of replying immediately?", options:["She ignored the email permanently","She took a walk and replied later, addressing the real issue","She forwarded the email to HR immediately","She replied angrily right away"], correct:1},
    {q:"What was the outcome of the director's delayed response?", options:["The relationship was damaged further","The real problem got solved and the relationship survived","The peer never responded","Nothing was resolved"], correct:1},
    {q:"In the 'reading the room' example, what did the team lead notice?", options:["An engineer's code quality had dropped","A normally talkative engineer had gone quiet for two weeks","A conflict between two team members","Missed deadlines"], correct:1},
    {q:"How did the team lead approach the quiet engineer?", options:["He ignored it, assuming it wasn't his business","He publicly called out the change in a team meeting","He asked a private, low-pressure question","He filed a formal performance concern"], correct:2},
    {q:"What does emotional intelligence explicitly NOT mean, according to the lesson?", options:["Suppressing all emotion","Noticing emotional patterns","Widening the gap between feeling and acting","Reading other people accurately"], correct:0},
    {q:"Why might immediate emotional reactions be risky for a leader?", options:["They are always dishonest","They rarely produce the leader's best, most useful response","They take too much time","They are illegal in most workplaces"], correct:1},
    {q:"Which best summarizes this lesson?", options:["Leaders should hide their emotions from their teams","Noticing and managing emotional responses, in yourself and others, improves leadership decisions","Emotional intelligence is only relevant in customer service roles","Feelings are irrelevant to good leadership"], correct:1}
  ]

{
  id:"l4", title:"Communicating with Clarity", desc:"Why clear, specific language is a leadership skill, not just a writing skill.",
  reading:[
    "Vague communication is one of the most common, and most fixable, leadership weaknesses. 'Let's try to improve this soon' asks nothing of anyone in particular. 'Can you send me a revised draft by Thursday at 5pm?' asks something clear of someone specific, by a specific time.",
    "Clarity matters most when news is bad. A leader who goes vague under pressure, hedging and adding qualifiers, teaches their team not to trust the good news either, since they cannot tell which version of the leader they are getting.",
    "## The Anatomy of a Clear Request",
    "Most vague communication is missing one of three things: a specific owner, a specific action, and a specific deadline. Remove any one of the three and a request becomes something people can politely agree with and then quietly never act on, not because they are being difficult, but because there was genuinely nothing concrete to act on. Before sending any request, it is worth checking it against all three: who exactly is doing this, what exactly are they doing, and by when exactly does it need to happen.",
    "## The Cost of Staying Vague",
    "Vagueness often feels safer in the moment. It avoids the discomfort of pinning yourself, or someone else, to a specific commitment that might not be met. But this safety is an illusion with a delayed bill attached. Vague requests get quietly deprioritized against clearer, more specific demands from elsewhere. Vague feedback gets misunderstood or ignored. Over time, a pattern of vagueness costs real time, since work has to be redone or re-requested, and it costs trust, since people learn they cannot act confidently on what you say.",
    "## Clarity Under Pressure",
    "It is one thing to be clear when the news is good. The real test comes when the news is bad: a missed deadline, a budget cut, a project being cancelled. The instinct under this kind of pressure is often to soften the message with qualifiers, 'there have been some challenges,' 'we're reassessing a few things,' hoping the vagueness will cushion the blow. It rarely does. What it actually does is signal to the listener that something is being hidden, which is usually more unsettling than the bad news itself would have been. Clear, direct bad news, paired with what is being done about it, is almost always received better than vague, hedged bad news.",
    "## Before You Communicate",
    "A simple habit improves almost any message: before sending it, ask what you want the listener to know, feel, or do differently after reading it. If you cannot answer that question specifically, the message likely needs another pass. This single question catches most vague communication before it goes out, because it forces you to identify a concrete purpose rather than simply transmitting information in the general direction of a problem."
  ],
  examples:[
    {title:"Example: The vague ask", text:"A manager tells her team, 'We should probably tighten up our documentation at some point.' Three months later, documentation is unchanged, because no one owned the task, and no deadline existed. Nobody did anything wrong; nothing specific was ever asked."},
    {title:"Example: Clear bad news", text:"A project lead has to tell his team a launch is delayed by three weeks. Instead of saying 'there have been some challenges and we're reassessing timelines,' he says: 'We missed the target because of a vendor delay outside our control. Here's the new date, and here's what we're doing differently.' The team is disappointed, but they trust him more, not less."}
  ],
  takeaways:["Vague requests ask nothing of anyone specifically; clear requests name who, what, and when.","Clarity matters most, and is hardest, when the news is bad.","Hedging under pressure erodes trust in even the good news later.","Before communicating, ask what you want the listener to know, feel, or do differently afterward."],

    {q:"What does the lesson say happens when a leader goes vague specifically during bad news?", options:["The team stops trusting good news too, since they can't tell which version of the leader they're getting","Nothing changes either way","The team appreciates being protected from details","It has no long-term effect on trust"], correct:0},
    {q:"In the 'vague ask' example, why did documentation stay unchanged for three months?", options:["The team disagreed with the idea","No one owned the task and no deadline existed","The manager forgot she asked","The team was too busy with other projects"], correct:1},
    {q:"In the 'clear bad news' example, what made the project lead's message effective?", options:["He avoided mentioning the delay directly","He named the cause, gave a new date, and explained the change in approach","He blamed the vendor publicly by name","He apologized repeatedly without details"], correct:1},
    {q:"What was the team's reaction to the clear bad news, according to the lesson?", options:["They trusted him less despite the clarity","They were disappointed but trusted him more, not less","They ignored the update entirely","They demanded his resignation"], correct:1},
    {q:"According to the lesson, what question should you ask before sending a message?", options:["Is this message long enough?","What do I want the listener to know, feel, or do differently afterward?","Does this sound impressive?","Will this message make me look busy?"], correct:1},
    {q:"What is the main problem with the phrase 'let's try to improve this soon'?", options:["It's too formal","It doesn't name who is responsible or by when","It's too aggressive","It uses too much jargon"], correct:1},
    {q:"Why might hedged, vague language feel 'safer' to a leader in the short term?", options:["Because it avoids being pinned to a specific commitment","Because it's always more accurate","Because employees prefer vague updates","Because it takes less time to write"], correct:0},
    {q:"What long-term cost does the lesson associate with habitual vagueness?", options:["None, it has no real cost","Wasted time and eroded trust, since people can't act on unclear requests","Improved team morale","Faster decision-making"], correct:1},
    {q:"Which best summarizes this lesson's core idea?", options:["Long messages are always better than short ones","Specific, clear communication, especially under pressure, builds trust and gets things done","Leaders should avoid delivering bad news whenever possible","Clarity only matters for written communication, not spoken"], correct:1}

{
  id:"l5", title:"Active Listening and Asking Good Questions", desc:"Listening to understand, not just to reply, and using questions to open up thinking.",
  reading:[
    "Most people listen to respond, not to understand. They are half-formulating their reply while the other person is still talking. Active listening means setting that aside, at least for a moment, and genuinely trying to understand what someone means before deciding what you think about it.",
    "Good questions do more work than good statements. A leader who asks 'What would need to be true for this to work?' opens up thinking. A leader who only states opinions closes it down, even unintentionally.",
    "## Two Ways of Listening",
    "Listening to respond is the default mode for most conversations, and it is easy to fall into without noticing, because it feels productive. You are thinking ahead, preparing your answer, staying engaged. But it means you are only partially processing what the other person is actually saying, and you are prone to hearing the version of their statement that fits what you already expected, rather than what they meant. Listening to understand requires a small, deliberate pause: setting aside your own reply long enough to check whether you've actually grasped the point being made, often by reflecting it back before responding.",
    "This does not mean agreeing with everything you hear. Understanding a position fully is a separate step from evaluating it. Skipping straight to evaluation is exactly what causes people to miss real problems hiding underneath a surface-level complaint.",
    "## The Power of a Good Question",
    "Statements tend to close conversations down, even well-intentioned ones, because they present a conclusion for others to accept or reject. Questions tend to open conversations up, because they invite the other person to think alongside you rather than react to you. This is especially valuable when a group is stuck: two strongly held opinions can deadlock a discussion for weeks, while a single well-placed question, like asking what would need to be true for one option to clearly be correct, can shift the entire group from defending positions to examining assumptions together.",
    "Good questions share a few traits: they are genuinely open, not a statement in disguise; they invite specifics rather than generalities; and they are asked with real curiosity rather than as a way to lead someone toward a predetermined answer. People can usually tell the difference between a question asked to learn and a question asked to trap, and only the former builds trust over time.",
    "## Practicing Active Listening Daily",
    "Like the other skills in this course, active listening improves with small, repeated practice rather than one big effort. A useful habit in any conversation, especially a difficult one, is to resist replying immediately and instead ask one clarifying question first: 'What specifically about it is the problem?' or 'Can you say more about that?' This single habit, applied consistently, tends to surface the real issue far more often than jumping straight to a solution or a defense."
  ],
  examples:[
    {title:"Example: Listening to understand", text:"An employee complains that a new process is 'annoying.' A manager who listens to respond might say, 'It's not that bad, you'll get used to it.' A manager who listens to understand asks, 'What specifically about it is slowing you down?' and discovers a genuine bottleneck worth fixing."},
    {title:"Example: A question that opens things up", text:"A team is stuck debating two options for weeks. Instead of picking one, the lead asks, 'What would need to be true for option A to clearly be the better choice?' The question shifts the group from arguing preferences to examining assumptions, and they reach a decision within a day."}
  ],
  takeaways:["Listening to understand is different from listening to reply.","Good questions open up thinking; opinions often close it down.","Assuming you already understand a complaint can cause you to miss the real issue.","Reframing a stuck debate as a question about assumptions can unstick it."],
  quiz:[
    {q:"What is the key difference the lesson draws between listening to respond and listening to understand?", options:["There is no real difference","Listening to respond means formulating your reply while the other person talks; listening to understand means setting that aside first","Listening to respond is always better","Listening to understand takes less time"], correct:1},
    {q:"In the first example, what did the manager who 'listened to understand' do differently?", options:["She dismissed the complaint quickly","She asked what specifically was slowing the employee down","She agreed immediately without asking anything","She escalated the complaint to HR"], correct:1},
    {q:"What did the manager in the first example discover by asking a follow-up question?", options:["The employee was simply resistant to change","A genuine bottleneck in the process worth fixing","Nothing new","That the process needed to be scrapped entirely"], correct:1},
    {q:"According to the lesson, what do good questions do that statements often don't?", options:["Good questions open up thinking; statements can close it down","Good questions always end debates faster","Statements are always more persuasive","Questions are only useful for gathering facts"], correct:0},
    {q:"In the second example, what question helped unstick the team's debate?", options:["'Which option do you personally prefer?'","'What would need to be true for option A to clearly be the better choice?'","'Can we vote on this right now?'","'Why is this taking so long?'"], correct:1},
    {q:"What effect did that question have on the team's discussion?", options:["It shifted the group from arguing preferences to examining assumptions","It ended the meeting early with no resolution","It made the disagreement worse","It had no measurable effect"], correct:0},
    {q:"Why might assuming you already understand a complaint be risky for a leader?", options:["It saves time overall","It can cause you to miss the real, underlying issue","It always makes employees feel heard","It is generally accurate"], correct:1},
    {q:"What is one practical benefit of active listening mentioned in the lesson?", options:["It ends conversations more quickly","It uncovers real issues that a quick reply would miss","It removes the need for questions entirely","It is mainly useful for one-on-one meetings only"], correct:1},
    {q:"Which best describes what makes a question 'good' in this lesson's sense?", options:["It has an obvious, single correct answer","It opens up new thinking rather than confirming an existing opinion","It is short and simple","It avoids challenging assumptions"], correct:1},
    {q:"Which best summarizes this lesson's core idea?", options:["Leaders should talk more than they listen","Listening to genuinely understand, and asking questions that open up thinking, are leadership skills in themselves","Questions are less useful than direct statements","Active listening is only relevant in customer service"], correct:1}
  ]

{
  id:"l6", title:"Building and Trusting Teams", desc:"Moving from doing the work yourself to making the group capable.",
  reading:[
    "A common trap for new leaders is staying the best individual performer instead of becoming a multiplier. If you are still the one who has to fix every mistake and make every call, you have not built a team, you have built a queue that runs through you.",
    "Delegation is not just handing off tasks, it is handing off decisions, along with enough context that the other person can make a good one without checking in constantly. Trust runs in both directions: a team trusts a leader who lets them own real work, and a leader learns to trust a team by giving them something real to be responsible for.",
    "## From Doer to Multiplier",
    "This trap is understandable. It is usually the skills a leader was individually good at that got them into a leadership role in the first place, so staying hands-on feels safe, even virtuous. But a leader's job is fundamentally different from an individual contributor's job: it is not to produce the most output personally, it is to increase the output and capability of the whole group. A leader who is still the bottleneck for every decision has, often without realizing it, built a structure that cannot scale past their own personal capacity.",
    "## What Real Delegation Looks Like",
    "Handing someone a task without handing them the underlying decision and context is not really delegation, it is just outsourced execution, and it tends to produce exactly the results a fully specified instruction would produce, no more and no less. Real delegation includes three things: the outcome that matters, the boundaries within which the person is free to operate, and enough background for their judgment to actually be useful. Given those three things, most capable people make good decisions on their own far more often than an anxious leader expects.",
    "## When Someone Chooses Differently Than You Would",
    "One of the hardest parts of delegation is watching someone solve a problem in a way you would not have chosen, and letting them, as long as it stays within the agreed boundaries. A different approach is not automatically a wrong one; it can still be a completely legitimate path to the same outcome, and overriding it just because it differs from your instinct quietly teaches people to stop using their own judgment and simply wait for your instructions instead. Reserve correction for outcomes that actually miss the mark or cross a real boundary, not for choices that are simply different from the one you personally would have made.",
    "## Trust Compounds in Both Directions",
    "Trust between a leader and a team is not something a leader simply possesses and distributes downward. It builds through repeated cycles: the leader gives real responsibility, the team member handles it well (or handles a mistake honestly), and each side updates their trust in the other slightly upward. Skip this cycle, either by never delegating anything real or by yanking back responsibility at the first sign of a different approach, and the trust needed for a genuinely capable team never has the chance to form."
  ],
  examples:[
    {title:"Example: Handing off the decision, not just the task", text:"A manager used to review and rewrite every client email his team sent. He started instead sharing three examples of 'what good looks like' and told his team: 'Use your judgment inside these guardrails, and flag anything genuinely unusual.' Within a month, email quality was consistent and his review time dropped by 80 percent."},
    {title:"Example: A mistake made in good faith", text:"A team member tries a new approach that the lead did not suggest, and it fails, costing a day of work. Instead of taking over decisions going forward, the lead debriefs what was learned and says, 'I'd rather you try things and sometimes miss than never try.' The team member takes more, smarter risks afterward, not fewer."}

{
  id:"l7", title:"Giving and Receiving Feedback", desc:"Making feedback specific, timely, and something people can actually use.",
  reading:[
    "Feedback fails most often not because it is harsh, but because it is vague or delayed. 'Good job' and 'this needs work' both tell someone almost nothing they can act on. Specific, timely feedback, given close to the moment it applies to, is far more useful, even when it is critical.",
    "Receiving feedback well is its own skill. The instinct to explain or defend immediately often stops you from actually hearing what was said. A simple habit: pause, ask a clarifying question if needed, and say thank you before deciding how you feel about it.",
    "## What Makes Feedback Actionable",
    "Useful feedback almost always contains three ingredients: the specific moment or behavior being referenced, the concrete impact it had, and, where relevant, a specific suggestion for what to try differently. Feedback missing any of these three tends to be technically true but practically useless. Telling someone their presentations 'need more energy' is accurate and unhelpful; naming the exact moment attention dropped and offering something concrete to try next time is both accurate and genuinely actionable.",
    "## Timing Matters As Much As Content",
    "Feedback delivered weeks after the fact loses most of its power, because the specific moment has faded from memory for both people, and it becomes difficult to reconstruct exactly what happened or why it mattered. Feedback delivered close to the moment it applies to, ideally within a day or two, is far easier to connect to something concrete, which makes it easier to hear, remember, and actually apply the next time a similar situation arises.",
    "## Receiving Feedback Without Defending",
    "The instinct to explain, justify, or defend a decision the moment feedback is offered is nearly universal, and it is almost always counterproductive. Explaining your reasoning before you've fully heard the other person's point tends to shut down the conversation prematurely, leaving both people slightly more entrenched in their original positions. A better sequence is to pause, ask a clarifying question if anything is unclear, and say thank you, before deciding internally how you feel about what was said. This does not mean automatically agreeing with every piece of feedback you receive; it means making sure you have actually understood it before you evaluate it.",
    "## Building a Feedback Habit",
    "Teams that exchange feedback well usually do not have naturally thicker skin than other teams, they simply practice more often, in smaller, lower-stakes doses. Waiting for an annual review to deliver all feedback at once guarantees that every piece of it will feel disproportionately large and difficult to hear. Regular, specific, low-drama feedback, given close to the moment and received without defensiveness, keeps the whole practice much lighter and far more useful for everyone involved."
  ],
  examples:[
    {title:"Example: Specific over vague", text:"Instead of telling a report 'your presentations need more energy,' a manager says, 'In the last two slides, you read directly from the screen and the room's attention dropped. Try explaining the chart in your own words next time and see if that changes the energy.' The second version gives something concrete to try."},
    {title:"Example: Receiving feedback without defending", text:"A designer is told her latest mockup misses a key requirement. Her first instinct is to explain why she made that choice. Instead, she pauses, asks 'Can you say more about which requirement?', and says thanks before responding. She ends up understanding a real gap, instead of having only defended her original decision."}
  ],
  takeaways:["Vague or delayed feedback is hard to act on, regardless of tone.","Specific feedback names the moment, the behavior, and a concrete suggestion.","Defending immediately often blocks you from actually hearing feedback.","Pausing and asking a clarifying question improves how well feedback lands and is understood."],
  quiz:[
    {q:"According to the lesson, why does feedback most often fail?", options:["Because it is too harsh","Because it is vague or delayed, not because it's critical","Because it's given too often","Because it's always negative"], correct:1},
    {q:"In the 'specific over vague' example, what made the second version of feedback more useful?", options:["It was shorter","It named a specific moment, behavior, and a concrete suggestion to try","It avoided mentioning any problem","It focused only on praise"], correct:1},
    {q:"What is the lesson's suggested habit for receiving feedback well?", options:["Immediately explain your reasoning","Pause, ask a clarifying question if needed, and say thank you before reacting","Argue your case before agreeing to anything","Ignore feedback that feels unfair"], correct:1},
    {q:"In the second example, what did the designer do instead of explaining her choice right away?", options:["She argued her original reasoning immediately","She paused, asked for clarification, and thanked the person first","She dismissed the feedback entirely","She apologized repeatedly without asking questions"], correct:1},
    {q:"What did the designer gain by responding this way?", options:["Nothing, the outcome was the same either way","A real understanding of the gap, instead of only defending her original decision","A guarantee that her design would be accepted unchanged","Less feedback in the future"], correct:1},
    {q:"Why might the instinct to explain immediately get in the way of receiving feedback?", options:["It always makes the feedback giver angry","It can prevent you from actually hearing what was said","Explaining is generally rude","It has no real effect"], correct:1},
    {q:"What does 'good job' fail to give someone, according to the lesson?", options:["Encouragement","Something specific they can act on","A positive emotional response","Recognition"], correct:1},
    {q:"Why does the lesson emphasize timeliness in feedback?", options:["Timeliness doesn't matter, only content does","Feedback given close to the moment it applies to is more useful and actionable","Delayed feedback is always more thoughtful","Immediate feedback is always harsher"], correct:1},
    {q:"What is one likely benefit of asking a clarifying question before responding to feedback?", options:["It delays the conversation unnecessarily","It can prevent misunderstanding and surface the real, actionable point","It signals disagreement","It is mainly a stalling tactic"], correct:1},
    {q:"Which best summarizes this lesson's core idea?", options:["Feedback should always be positive to be effective","Specific, timely feedback, given and received without defensiveness, is what actually helps people improve","Only managers should give feedback","Feedback is most useful when it's general so it applies broadly"], correct:1}
  ]
