function approvePaymentRequest(id){
  if(!adminSession.loggedIn) return;
  const request = paymentRequests.find(r => r.id === id);
  if(!request || request.status !== "PENDING") return;
  request.status = "APPROVED";
  request.decidedAt = new Date().toISOString();
  request.decidedBy = adminSession.name || "Unknown admin";
  savePaymentRequests();
  // Activate enrollment: unlock the purchased course so it appears unlocked
  // in "Your courses" and the learner can start it immediately. This only
  // affects THIS browser's own progress data — see the top-of-file note on
  // why a real cross-device rollout needs a backend.
  const p = progressFor(request.courseId);
  p.unlocked = true;
  saveProgress();
  logAudit("approved", request);
  sendAutomaticEmail("approved", request);
  render();
}

function rejectPaymentRequestPrompt(id){
  const reason = typeof window.prompt === "function"
    ? window.prompt("Optional: reason for rejecting this payment (you can share this with the student).", "")
    : "";
  if(reason === null) return;
  rejectPaymentRequest(id, reason);
}

function rejectPaymentRequest(id, reason){
  if(!adminSession.loggedIn) return;
  const request = paymentRequests.find(r => r.id === id);
  if(!request || request.status !== "PENDING") return;
  request.status = "REJECTED";
  request.decidedAt = new Date().toISOString();
  request.decidedBy = adminSession.name || "Unknown admin";
  request.rejectionReason = String(reason || "").trim();
  savePaymentRequests();
  logAudit("rejected", request);
  sendAutomaticEmail("rejected", request);
  render();
}

function notificationEmailContent(request){
  if(request.status === "APPROVED"){
    return {
      subject: `Your ${request.courseTitle} enrollment is confirmed`,
      body: `Hi ${request.studentName},\n\nYour payment has been verified. Your course is now available.\n\n${request.courseTitle} (${request.amountLabel} via ${request.paymentMethod}, reference ${request.transactionRef}) is unlocked — sign back in to GBLU Academy and open it from "Your courses".\n\nThanks for enrolling!\nGBLU Academy`
    };
  }
  if(request.status === "REJECTED"){
    return {
      subject: `About your ${request.courseTitle} payment`,
      body: `Hi ${request.studentName},\n\nYour payment could not be verified.\n\nWe were unable to confirm your payment for ${request.courseTitle} (reference ${request.transactionRef}).${request.rejectionReason ? ` Reason: ${request.rejectionReason}.` : ""}\n\nPlease reply to this email, or resubmit your payment details with a clearer screenshot, and we'll take another look.\n\nGBLU Academy`
    };
  }
  // Still PENDING: this is the "payment submitted" notification.
  return {
    subject: `We received your ${request.courseTitle} payment submission`,
    body: `Hi ${request.studentName},\n\nYour payment has been received and is waiting for verification.\n\nWe'll manually confirm your payment for ${request.courseTitle} (${request.amountLabel} via ${request.paymentMethod}, reference ${request.transactionRef}) and follow up shortly — no action is needed from you right now.\n\nGBLU Academy`
  };
}

function mailtoLink(request){
  const content = notificationEmailContent(request);
  return `mailto:${encodeURIComponent(request.studentEmail)}?subject=${encodeURIComponent(content.subject)}&body=${encodeURIComponent(content.body)}`;
}

// ---------------------------------------------------------------------------
// Automatic notification emails (EmailJS). Fire-and-forget: a slow or failed
// send is logged to the console and otherwise ignored — it never blocks or
// reverses submission/approval/rejection, which are the source of truth.

function emailJsIsConfigured(){
  const c = EMAIL_CONFIG;
  return !!(c.publicKey && !c.publicKey.startsWith("YOUR_")
    && c.serviceId && !c.serviceId.startsWith("YOUR_")
    && c.templateIds.submitted && !c.templateIds.submitted.startsWith("YOUR_")
    && c.templateIds.approved && !c.templateIds.approved.startsWith("YOUR_")
    && c.templateIds.rejected && !c.templateIds.rejected.startsWith("YOUR_"));
}

function initEmailJs(){
  if(typeof window === "undefined" || !window.emailjs) return;
  if(!emailJsIsConfigured()) return;
  try{
    window.emailjs.init({publicKey: EMAIL_CONFIG.publicKey});
  }catch(err){
    console.warn("EmailJS failed to initialize:", err);
  }
}

// Builds the variable set handed to whichever EmailJS template is used.
// Keep these names in sync with the {{placeholders}} inside each of the
// three EmailJS templates referenced by EMAIL_CONFIG.templateIds.
function buildEmailTemplateParams(request){
  const content = notificationEmailContent(request);
  return {
    to_email: request.studentEmail,
    student_name: request.studentName,
    course_title: request.courseTitle,
    amount_label: request.amountLabel,
    payment_method: request.paymentMethod,
    transaction_ref: request.transactionRef,
    rejection_reason: request.rejectionReason || "",
    subject: content.subject,
    message: content.body
  };
}

// kind: "submitted" | "approved" | "rejected"
function sendAutomaticEmail(kind, request){
  if(!request || !request.studentEmail) return;
  if(typeof window === "undefined" || !window.emailjs){
    console.warn(`EmailJS SDK not loaded — skipped "${kind}" email to ${request.studentEmail}.`);
    return;
  }
  if(!emailJsIsConfigured()){
    console.warn(`EmailJS not configured yet (see EMAIL_CONFIG) — skipped "${kind}" email to ${request.studentEmail}.`);
    return;
  }
  const templateId = EMAIL_CONFIG.templateIds[kind];
  const params = buildEmailTemplateParams(request);
  window.emailjs.send(EMAIL_CONFIG.serviceId, templateId, params)
    .then(() => console.info(`Sent "${kind}" email to ${request.studentEmail}.`))
    .catch(err => console.warn(`Failed to send "${kind}" email to ${request.studentEmail}:`, err));
}

async function submitUnlockCode(event){
  if(event) event.preventDefault();
  const courseId = ["core","leadership","communication","business","strategic","team"].includes(state.paymentCourse) ? state.paymentCourse : "core";
  const input = document.getElementById("unlockCodeField");
  const entered = String(input ? input.value : "").trim();
  if(!entered){
    state.unlockCodeError = "Enter the access code you were given after your payment was verified.";
    render();
    return;
  }

  state.unlockCodeError = "Checking your code…";
  render();

  const ERROR_MESSAGES = {
    invalid_code: "That access code doesn't exist. Double-check it, or wait for it to be sent once your payment is approved on Telegram.",
    wrong_course: "That code belongs to a different course.",
    already_used: "That code has already been used on a different device, so it can't be reused here.",
    missing_fields: "Something went wrong sending your request. Please try again."
  };

  try{
    const res = await fetch(`${GBLU_BOT_API}/validate`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ code: entered, course: courseId, deviceId: getDeviceId() })
    });
    let data = {};
    try{ data = await res.json(); }catch(e){}

    if(!res.ok || !data.ok){
      state.unlockCodeError = ERROR_MESSAGES[data.error] || "That access code doesn't match. Double-check it and try again.";
      render();
      return;
    }

    const p = progressFor(courseId);
    p.unlocked = true;
    state.unlockCodeError = "";
    saveProgress();
    openCourse(courseId);
  }catch(err){
    state.unlockCodeError = "Couldn't reach the verification server. Check your internet connection and try again.";
    render();
  }
}

function certificateId(){
  // This frontend-only ID is persistent and sufficiently unique for local use; true
  // certificate security and public verification require a backend and database.
  const course = activeCourseInfo();
  const year = new Date().getFullYear();
  let token = "";
  try{
    if(window.crypto && window.crypto.getRandomValues){
      const values = new Uint32Array(2);
      window.crypto.getRandomValues(values);
      token = Array.from(values).map(value => value.toString(36).toUpperCase().padStart(6,"0")).join("").slice(0,10);
    }
  }catch(e){ /* use the fallback below */ }
  if(!token) token = `${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(-10);
  return `GBLU-${course.code}-${year}-${token}`;
}

function resetProgress(){
  const confirmed = typeof window.confirm === "function" && window.confirm("Reset all GBLU Academy progress saved in this browser? This permanently removes this app's course progress, quiz results, names, and certificates. Other website data will not be affected.");
  if(!confirmed) return;
  const storage = getStorage();
  try{
    if(storage){
      storage.removeItem(STORAGE_KEY);
      storage.removeItem(LEGACY_STORAGE_KEY);
    }
  }catch(e){ console.warn("GBLU Academy could not reset saved progress.", e); }
  state = {
    view:"onboarding",
    lessonId:null,
    activeCourse:"core",
    paymentCourse:"core",
    unlockCodeError:"",
    ...createCourseProgress(),
    core:createCourseProgress(),
    communication:createCourseProgress(),
    business:createCourseProgress(),
    strategic:createCourseProgress(),
    team:createCourseProgress(),
    profile:createApplicantProfile(),
    verification:{id:"", status:"", message:"", courseTitle:"", name:"", score:null},
  };
  render();
}

function verifyCertificate(){
  const input = document.getElementById("verificationId");
  const id = String(input ? input.value : state.verification.id || "").trim().toUpperCase();
  const candidates = [
    {courseId:"core", progress:state.core},
    {courseId:"leadership", progress:state},
    {courseId:"communication", progress:state.communication},
    {courseId:"business", progress:state.business},
    {courseId:"strategic", progress:state.strategic},
    {courseId:"team", progress:state.team}
  ];
  const match = candidates.find(item => item.progress.certificateGenerated && item.progress.certificateId === id);
  if(match){
    const course = activeCourseInfoFor(match.courseId);
    state.verification = {
      id,
      status:"valid-local",
      message:"This certificate matches a certificate saved in this browser.",
      courseTitle:course.title,
      name:match.progress.certificateName,
      score:match.progress.certificateScore
    };
  }else{
    state.verification = {
      id,
      status:"not-found",
      message:id ? "No matching certificate was found in this browser's saved GBLU Academy data." : "Enter a certificate ID to check the certificates saved in this browser.",
      courseTitle:"",
      name:"",
      score:null
    };
  }
  render();
}

function renderAdminDashboard(){
  const requests = [...paymentRequests].sort((a,b) => {

  const pendingCount = paymentRequests.filter(r => r.status === "PENDING").length;
  return `

function renderCourse(){
  const course = activeCourseInfo();
  const lessons = course.lessons;
  const p = activeProgress();
  const done = completedCount();
  const pct = Math.round((done/lessons.length)*100);
  return `
    <section class="course-head">
      <h2>${course.title}</h2>
      <p>Lessons unlock one at a time as you progress — finish a lesson's quiz to unlock the next one right away. Move at your own pace. Each lesson includes real examples and a ${lessons[0].quiz.length}-question check.</p>
      <div class="pass-note">Passing requirement: ${PASS_THRESHOLD}% final score — this applies to every available course.</div>
      <div class="enrollment-note">Enrollment fee: <strong>${formatCoursePrice(state.activeCourse, selectedCountry())}</strong>. Ethiopia: 600 birr for GBLU Mastery: The Core Five and 200 birr for other courses. International pricing starts at $5 / $2 and is shown in the selected country's currency.</div>
    </section>
    <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    <ul class="waypoints">
      ${lessons.map((l,i) => {
        const isDone = isLessonFinalized(l.id, p);
        const unlocked = isUnlocked(l.id);
        return `
        ${state.activeCourse === "core" && (i === 0 || lessons[i-1].coreSection !== l.coreSection) ? `<li class="waypoint-section">${l.coreSection}</li>` : ''}
        <li class="waypoint">
          <div class="wp-marker ${isDone?'done':''} ${!unlocked?'locked':''}">${isDone ? '✓' : (i+1)}</div>
          <div class="wp-body">
            <div class="wp-title">${l.title}</div>
            <div class="wp-desc">${l.desc}</div>
            ${isDone ? `<div class="wp-status">Completed — scored ${lessonScore(l.id, p)}/${l.quiz.length}</div>` : ''}
            ${!isDone && !unlocked ? `<div class="wp-locked-msg">Complete the previous lesson to unlock</div>` : ''}
          </div>
          <button class="wp-action" ${!unlocked?'disabled':''} onclick="goTo('lesson','${l.id}')">${isDone ? 'Review' : (unlocked ? 'Begin' : 'Locked')}</button>
        </li>`;
      }).join("")}
    </ul>
  `;
}

function renderLesson(){
  const lessons = activeLessons();
  const p = activeProgress();
  const lesson = lessons.find(l => l.id === state.lessonId);
  if(!lesson || !isUnlocked(lesson.id)) return renderCourse();
  const answers = p.quizAnswers[lesson.id] || {};
  const locked = p.quizLocked[lesson.id] || false;
  const allAnswered = lesson.quiz.every((q,i) => answers[i] !== undefined);
  const correctCount = locked ? lessonScore(lesson.id, p) : lesson.quiz.filter((q,i) => answers[i] === q.correct).length;
  const answeredCount = lesson.quiz.filter((q,i) => answers[i] !== undefined).length;
  const lessonIdx = lessons.findIndex(l => l.id === lesson.id);
  const hasNext = lessonIdx < lessons.length - 1;
  const nextLabel = hasNext ? "Next lesson" : "View certificate";

  return `
    <section class="lesson">
      <div class="kicker">LESSON ${lessons.findIndex(l=>l.id===lesson.id)+1} OF ${lessons.length}</div>
      <h2>${lesson.title}</h2>
      ${lesson.reading.map(p => p.startsWith("## ") ? `<div class="lesson-h3">${p.slice(3)}</div>` : `<p>${p}</p>`).join("")}
      ${lesson.examples.map(ex => `
        <div class="example-box">
          <div class="ex-label">${ex.title}</div>
          <p>${ex.text}</p>
        </div>
      `).join("")}
      <div class="takeaways">
        <div class="tk-label">Understanding check</div>
        <ul>${lesson.takeaways.map(t => `<li>${t}</li>`).join("")}</ul>
      </div>
      <div class="divider"></div>
      <div class="kicker">QUIZ — ${lesson.quiz.length} QUESTIONS</div>
      ${locked
        ? `<div class="score-banner">Final score: ${correctCount} / ${lesson.quiz.length} — this result is permanent and counts toward your certificate.</div>`
        : `<div class="quiz-progress">Pick an answer for each question — use Clear answer to change your mind. Nothing is revealed until you finish. Answered: ${answeredCount} / ${lesson.quiz.length}.</div>`
      }
      ${lesson.quiz.map((q,i) => {
        const answered = answers[i] !== undefined;
        return `
        <div class="quiz-q">
          <div class="qtext">${i+1}. ${q.q}</div>
          ${q.options.map((opt,oi) => {
            let cls = "quiz-opt";
            if(locked){
              cls += " locked-opt";
              if(oi === q.correct) cls += " correct";
              else if(answers[i] === oi) cls += " wrong";
            } else if(answers[i] === oi){
              cls += " selected";
            }
             return `<button class="${cls}" ${locked?'disabled':''} aria-pressed="${answers[i] === oi ? 'true' : 'false'}" onclick="selectAnswer('${lesson.id}', ${i}, ${oi})">${opt}</button>`;
          }).join("")}
          ${locked && q.explanation ? `<div class="quiz-explanation"><strong>Why:</strong> ${q.explanation}</div>` : ''}
          ${!locked && answered ? `<button class="clear-btn" onclick="clearAnswer('${lesson.id}', ${i})">Clear answer</button>` : ''}
        </div>
      `;}).join("")}
      <div class="lesson-nav">
        <button class="btn-ghost" onclick="goTo('course')">Back to course</button>
        ${!locked
           ? (p.quizConfirming[lesson.id]
              ? `<span style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                   <span class="feedback" style="margin:0;">Lock in your answers? This can't be undone.</span>
                   <button class="btn-primary" onclick="confirmFinishQuiz('${lesson.id}')">Yes, finish quiz</button>
                   <button class="btn-ghost" onclick="cancelFinishQuiz('${lesson.id}')">Cancel</button>
                 </span>`
              : `<button class="btn-primary" ${!allAnswered?'disabled':''} onclick="askFinishQuiz('${lesson.id}')">Finish quiz (final, one-time)</button>`)
          : `<button class="btn-primary" onclick="goToNext('${lesson.id}')">${nextLabel}</button>`
        }
      </div>
      ${!locked ? '<div class="feedback">Answers are not revealed until you finish. Once you finish, there is no retry.</div>' : ''}
    </section>
  `;
}

function renderCertificate(){
  const course = activeCourseInfo();
  const p = activeProgress();
  const done = completedCount();
  const allDone = courseIsComplete();

  if(p.certificateGenerated && p.certificateId){
    return `
      <div class="cert-wrap">
        <div class="cert-intro">
          <h2>${escapeHtml(course.title)} certificate</h2>
          <p>This certificate was generated once and is permanently fixed — it cannot be regenerated or edited.</p>
        </div>
        ${renderCertificateCard(p.certificateName, p.certificateDate, p.certificateScore, p.certificateId)}
        <div class="cert-actions"><button class="btn-primary" onclick="window.print()">Download / print certificate</button></div>
      </div>
    `;
  }

  if(!allDone){
    return `
      <div class="cert-wrap">
        <div class="cert-intro">
          <h2>${escapeHtml(course.title)} certificate</h2>
          <p>Complete all ${course.lessons.length} lessons to unlock your certificate. You've finished ${done} of ${course.lessons.length} so far.</p>
        </div>
        <div style="text-align:center;"><button class="btn-primary" onclick="goTo('course')">Continue the course</button></div>
      </div>
    `;
  }

  const finalScore = totalScore();
  const finalPossible = totalPossible();
  const finalPct = Math.round((finalScore/finalPossible)*100);
  const willBePassing = finalPct >= PASS_THRESHOLD;

  if(!willBePassing){
    return `
      <div class="cert-wrap">
        <div class="cert-intro">
          <h2>Certificate unavailable</h2>
          <p>You completed all ${course.lessons.length} lessons, but your final quiz score is ${finalScore} / ${finalPossible} (${finalPct}%). A passing score of ${PASS_THRESHOLD}% is required to earn a certificate.</p>
        </div>
        <div class="verification-panel">
          <strong>This is not a passing certificate.</strong>
          <p class="feedback">No official completion certificate or certificate ID is generated for a score below the passing requirement.</p>
        </div>
        <div style="text-align:center;"><button class="btn-ghost" onclick="goTo('course')">Review the course</button></div>
      </div>
    `;
  }

  return `
    <div class="cert-wrap">
      <div class="cert-intro">
        <h2>You've completed ${escapeHtml(course.title)}</h2>
        <p>Enter your name exactly as you want it to appear. You will only be asked once — once generated, the certificate is permanently locked and cannot be changed.</p>
      </div>
      <div class="name-input">
        <label class="sr-only" for="nameInput">Full name for certificate</label>
        <input id="nameInput" type="text" placeholder="Your full name" value="${escapeHtml(p.name)}" autocomplete="name" oninput="updateLearnerName(this.value)">
      </div>
      <div class="lock-warning">This is a one-time action. Double-check the spelling before clicking Generate — it cannot be edited or regenerated afterward.</div>
      ${p.certNameError ? `<div class="lock-warning" style="color:#B85C5C;">${escapeHtml(p.certNameError)}</div>` : ''}
      <div style="text-align:center; margin-bottom:34px;">
        <button class="btn-primary" onclick="generateCertificate()">Generate certificate (final, one-time)</button>
      </div>
    </div>
  `;
}

function certCornerSVG(){
  // A single ornamental corner flourish, reused (mirrored via CSS) in all four corners.
  return `
    <svg viewBox="0 0 46 46" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 44 C2 20, 20 2, 44 2" fill="none" stroke="var(--cert-secondary)" stroke-width="1.4"/>
      <path d="M2 34 C2 17, 17 2, 34 2" fill="none" stroke="var(--cert-mid)" stroke-width="1"/>
      <circle cx="2" cy="44" r="2.6" fill="var(--cert-secondary)"/>
      <circle cx="44" cy="2" r="2.6" fill="var(--cert-secondary)"/>
      <path d="M9 44 C9 24, 24 9, 44 9" fill="none" stroke="var(--cert-light)" stroke-width="0.7"/>
    </svg>
  `;
}

function renderCertificateCard(name, fixedDate, score, id){
  const course = activeCourseInfo();
  const today = fixedDate || new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
  const possible = totalPossible();
  const pct = Math.round((score/possible)*100);
  const passed = pct >= PASS_THRESHOLD;
  const corner = certCornerSVG();
  return `
    <div class="cert-outer cert-theme-${course.id}">
      <div class="certificate" id="certificate">
        ${!passed ? `<div class="cert-stamp">Below passing score</div>` : ''}
        <div class="cert-corner tl">${corner}</div>
        <div class="cert-corner tr">${corner}</div>
        <div class="cert-corner bl">${corner}</div>
        <div class="cert-corner br">${corner}</div>
        <div class="cert-seal">${gbluLogo(96)}</div>
        <div class="cert-inner">
          <div class="cert-eyebrow">Certificate of Completion</div>
          <div class="cert-brand-row">
            <span class="cert-logo">${gbluLogo(40)}</span>
            <span class="cert-brand">GBLU</span>
          </div>
          <div class="cert-fullname">Global Business &amp; Leadership Union</div>
          <div class="cert-flourish"><span class="fl-line"></span><span class="fl-diamond"></span><span class="fl-line"></span></div>
           <div class="cert-title">${escapeHtml(course.certificateTitle)}</div>
          <div class="cert-body">This certifies that</div>
           <div class="cert-name">${escapeHtml(name)}</div>
            <div class="cert-body">has successfully completed all ten lessons of <span class="cert-course">${escapeHtml(course.title)}</span>, demonstrating practical judgment and the ability to make clear, defensible choices under uncertainty.</div>
           <div class="cert-score">Final quiz score: ${score} / ${possible} (${pct}%)</div>
           <div class="cert-id">Certificate ID: ${escapeHtml(id)}</div>
          ${!passed ? `<div class="cert-invalid-note">This score is below the ${PASS_THRESHOLD}% required to pass. This certificate does not meet the passing requirement and holds no value.</div>` : ''}
          <div class="cert-assurance">Certified and assured by the Office of the Chief Executive Officer, GBLU.</div>
          <div class="cert-footer">
             <div class="cert-sig">Date<br>${escapeHtml(today)}</div>
            <div class="cert-sig ceo-sig-block">
              ${CEO_SIGNATURE_IMG
                ? `<img src="${CEO_SIGNATURE_IMG}" alt="${CEO_NAME} signature" class="ceo-sig-img">`
                : `<div class="ceo-signature">${CEO_NAME}</div>`
              }
              <div class="ceo-sig-name">${CEO_NAME}</div>
              <div class="ceo-sig-title">${CEO_TITLE}</div>
            </div>
          </div>
          <div class="cert-site-tag">
            <img src="${GBLU_QR_IMG}" alt="QR code linking to the GBLU website" class="cert-site-qr">
            <div class="cert-site-text">
              <div class="label">GBLU online</div>
              <div class="url">gbluglobal-debug.github.io/GBLU</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

function selectAnswer(lessonId, qIndex, optIndex){
  const p = activeProgress();
  const lesson = activeLessons().find(item => item.id === lessonId);
  if(!lesson || !isUnlocked(lessonId) || !lesson.quiz[qIndex] || !Number.isInteger(optIndex) || optIndex < 0 || optIndex >= lesson.quiz[qIndex].options.length) return;
  if(p.quizLocked[lessonId]) return;
  if(!p.quizAnswers[lessonId]) p.quizAnswers[lessonId] = {};
  p.quizAnswers[lessonId][qIndex] = optIndex;
  saveProgress();
  render();
}

function clearAnswer(lessonId, qIndex){
  const p = activeProgress();
  if(p.quizLocked[lessonId]) return;
  if(p.quizAnswers[lessonId]) delete p.quizAnswers[lessonId][qIndex];
  saveProgress();
  render();
}

function goToNext(lessonId){
  const lessons = activeLessons();
  if(!isLessonFinalized(lessonId)) return;
  const idx = lessons.findIndex(l => l.id === lessonId);
  const next = lessons[idx+1];
  if(next) goTo('lesson', next.id);
  else if(courseIsComplete()) goTo('certificate');
}

function askFinishQuiz(lessonId){
  activeProgress().quizConfirming[lessonId] = true;
  render();
}

function cancelFinishQuiz(lessonId){
  activeProgress().quizConfirming[lessonId] = false;
  render();
}

function confirmFinishQuiz(lessonId){
  activeProgress().quizConfirming[lessonId] = false;
  finishQuiz(lessonId);
}

function finishQuiz(lessonId){
  const p = activeProgress();
  const lesson = activeLessons().find(l => l.id === lessonId);
  if(!lesson || !isUnlocked(lessonId) || p.quizLocked[lessonId]) return;
  const answers = p.quizAnswers[lessonId] || {};
  const allAnswered = lesson.quiz.every((q,i) => answers[i] !== undefined);
  if(!allAnswered) return;
  const validAnswers = lesson.quiz.every((q,i) => Number.isInteger(answers[i]) && answers[i] >= 0 && answers[i] < q.options.length);
  if(!validAnswers) return;
  const correctCount = lesson.quiz.filter((q,i) => answers[i] === q.correct).length;
  p.quizLocked[lessonId] = true;
  p.lessonScores[lessonId] = correctCount;
  p.finalResults[lessonId] = {score:correctCount, finalizedAt:new Date().toISOString()};
  p.completed[lessonId] = true;
  saveProgress();
  render();
}

function generateCertificate(){
  const p = activeProgress();
  if(p.certificateGenerated) return;
  if(!courseIsComplete()) return;
  const finalScore = totalScore();
  const finalPossible = totalPossible();
  const finalPct = Math.round((finalScore/finalPossible)*100);
  if(finalPct < PASS_THRESHOLD){ render(); return; }
  const finalName = (p.name || "").trim();
  if(!finalName){ p.certNameError = "Please enter your name before generating."; render(); return; }
  p.certNameError = "";
  p.certificateGenerated = true;
  p.certificateName = finalName;
  p.certificateDate = new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'});
  p.certificateScore = finalScore;
  p.certificateId = certificateId();
  saveProgress();
  render();
}

function renderVerification(){
  const verification = state.verification || {id:"", status:"", message:"", courseTitle:"", name:"", score:null};
  return `
    <section class="cert-wrap">
      <div class="cert-intro">
        <h2>Verify a certificate</h2>
        <p>Enter an ID to check certificates saved in this browser.</p>
      </div>
      <div class="verification-panel">
        <p>This frontend-only site can check local browser data, but it cannot provide public or server verification. A future backend and database would be required for that.</p>
        <form class="verification-form" onsubmit="event.preventDefault(); verifyCertificate()">
          <label class="sr-only" for="verificationId">Certificate ID</label>
          <input id="verificationId" type="text" value="${escapeHtml(verification.id)}" placeholder="Example: GBLU-LP-2026-ABC123" autocomplete="off" spellcheck="false">
          <button class="btn-primary" type="submit">Check certificate</button>
        </form>
        ${verification.message ? `
          <div class="verification-result ${verification.status === 'not-found' ? 'invalid' : ''}" role="status">
            <strong>${verification.status === 'valid-local' ? 'Certificate found locally' : 'Certificate not found'}</strong><br>
            ${escapeHtml(verification.message)}
            ${verification.status === 'valid-local' ? `<br><br><strong>Course:</strong> ${escapeHtml(verification.courseTitle)}<br><strong>Name:</strong> ${escapeHtml(verification.name)}<br><strong>Score:</strong> ${escapeHtml(verification.score)} / ${totalPossibleFor(verification.courseTitle)} </div>` : '</div>'}
        ` : ''}
      </div>
    </section>
  `;
}

function totalPossibleFor(courseTitle){
  const course = [activeCourseInfoFor("core"), activeCourseInfoFor("leadership"), activeCourseInfoFor("communication"), activeCourseInfoFor("business"), activeCourseInfoFor("strategic"), activeCourseInfoFor("team")].find(item => item.title === courseTitle);
  return course ? course.lessons.reduce((sum, lesson) => sum + lesson.quiz.length, 0) : 0;
}

function render(){
  let body = "";
  if(state.view === "onboarding"){
    app.innerHTML = renderOnboarding();
    return;
  }
  if(state.view === "home") body = renderHome();
  else if(state.view === "payment") body = renderPayment();
  else if(state.view === "course") body = !isCourseUnlocked(state.activeCourse) ? renderPayment(state.activeCourse) : (courseIsComplete() ? renderCertificate() : renderCourse());
  else if(state.view === "lesson") body = !isCourseUnlocked(state.activeCourse) ? renderPayment(state.activeCourse) : (courseIsComplete() ? renderCertificate() : renderLesson());
  else if(state.view === "certificate") body = isCourseUnlocked(state.activeCourse) ? renderCertificate() : renderPayment(state.activeCourse);
  else if(state.view === "verify") body = renderVerification();
  else if(state.view === "admin-login") body = adminSession.loggedIn ? renderAdminDashboard() : renderAdminLogin();
  else if(state.view === "admin") body = adminSession.loggedIn ? renderAdminDashboard() : renderAdminLogin();
  app.innerHTML = renderNav() + body;
}

initEmailJs();
loadProgress();
loadPaymentData();

// --- Basic copy/inspect deterrents ---------------------------------------
// None of this stops a determined, technical visitor (browser devtools can
// always be opened from the menu bar), but it removes the easy, accidental
// paths: right-click, the common Inspect/View Source keyboard shortcuts, and
// drag-selecting lesson text to copy it.
document.addEventListener("contextmenu", function(e){ e.preventDefault(); return false; });

document.addEventListener("keydown", function(e){
  const key = (e.key || "").toLowerCase();
  const blockCombo =
    key === "f12" ||
    ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === "i" || key === "j" || key === "c")) ||
    ((e.ctrlKey || e.metaKey) && (key === "u" || key === "s"));
  if(blockCombo){
    e.preventDefault();
    return false;
  }
});
